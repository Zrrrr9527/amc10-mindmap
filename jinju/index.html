<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<title>AMC 10 · 金句与补丁</title>
<style>
:root{--paper:#faf8f4;--card:#fff;--ink:#1f2328;--ink2:#4c545e;--ink3:#8a929c;
 --line:#e8e2d8;--amber:#b8762c;--amber-s:#f6ead8;--blue:#2f5f8f;--blue-s:#e6eef7;
 --ok:#3f7d5b;--ok-s:#e6f0ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
body{padding-bottom:40px}
button{font-family:inherit}
svg{display:block;width:100%;height:auto}
svg text{font-family:inherit}

/* ── 顶栏 ── */
.top{position:sticky;top:0;z-index:20;background:rgba(250,248,244,.95);
 backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0 0}
.top .in{max-width:980px;margin:0 auto;padding:0 18px}
.hrow{display:flex;align-items:baseline;gap:10px}
.hrow h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
.hrow .sub{font-size:12px;color:var(--ink3)}
.pbar{height:5px;border-radius:3px;background:#ece5d9;margin:9px 0 7px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c98a3d,#b8762c);
 border-radius:3px;transition:width .5s ease}
.pstat{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);margin-bottom:9px}
.pstat b{color:var(--ink);font-weight:600}
.plast{font-size:11.5px;color:var(--ink3);margin:-4px 0 9px;min-height:16px}
.plast em{font-style:normal;color:var(--amber)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;font-size:12.5px;padding:4px 11px;border-radius:999px;
 border:1px solid var(--line);background:var(--card);color:var(--ink2)}
.chips button.on{border-color:var(--amber);color:var(--amber);background:var(--amber-s)}
.chips button.go{border-color:var(--amber);color:#fff;background:var(--amber)}
.chips select{flex:0 0 auto;font-size:12.5px;padding:4px 8px;border-radius:999px;
 border:1px solid var(--line);background:var(--card);color:var(--ink2);max-width:150px}
.cstat{margin-left:auto;flex:0 0 auto;font-size:11.5px;color:var(--ink3);padding:4px 2px}
.cstat.ok{color:var(--ok)}.cstat.err{color:#b3452f}

/* ── 列表 ── */
main{max-width:980px;margin:0 auto;padding:18px 18px 0}
section{margin-bottom:26px}
section h2{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:1px;
 margin:0 0 10px;display:flex;align-items:center;gap:8px}
section h2 em{font-style:normal;font-size:11.5px;color:#b0a693;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px 14px;
 cursor:pointer;transition:border-color .18s,transform .18s;position:relative}
.card:active{transform:scale(.992)}
.card:hover{border-color:#dccdb4}
.card .row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.card .code{font-size:11.5px;color:#fff;background:var(--amber);border-radius:5px;
 padding:1px 7px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.card[data-k="audio"] .code{background:var(--blue)}
.card .mod{font-size:11.5px;color:var(--ink3)}
.card .kind{margin-left:auto;font-size:10.5px;color:var(--ink3);display:flex;align-items:center;gap:3px}
.card .kind i{font-style:normal;font-size:9px;width:14px;height:14px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;border:1px solid currentColor}
.card[data-k="anim"] .kind i{color:var(--amber)}
.card[data-k="audio"] .kind i{color:var(--blue)}
.card .n{font-size:10.5px;color:var(--ok);background:var(--ok-s);border-radius:20px;
 padding:1px 7px;margin-left:4px;display:none}
.card.done .n{display:block}
.card.done{border-color:#dbe8e0}
.card.done .code{opacity:.85}
.card .q{margin:0;font-size:14.5px;line-height:1.62;color:var(--ink);
 display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--ink3);font-size:13px;padding:40px 0;text-align:center}

/* ── 播放层 ── */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .mask{position:absolute;inset:0;background:rgba(31,35,40,.42);opacity:0;transition:opacity .22s}
.sheet.in .mask{opacity:1}
.sheet-in{position:relative;background:var(--paper);width:100%;max-width:760px;
 max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:0 0 18px;
 transform:translateY(18px);opacity:0;transition:transform .26s cubic-bezier(.22,.72,.32,1),opacity .22s}
.sheet.in .sheet-in{transform:none;opacity:1}
.sheet header{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;
 align-items:center;gap:9px;padding:13px 18px 11px;border-bottom:1px solid var(--line)}
.sheet .code{font-size:11.5px;color:#fff;background:var(--amber);border-radius:5px;padding:1px 8px}
.sheet[data-k="audio"] .code{background:var(--blue)}
.sheet .mod{font-size:12px;color:var(--ink3)}
.sheet .x{margin-left:auto;border:0;background:none;font-size:19px;color:var(--ink3);
 padding:2px 6px;cursor:pointer;line-height:1}
.sheet .bd{padding:16px 18px 6px}
.sheet .q{font-size:16.5px;line-height:1.75;margin:0 0 14px;font-weight:500}
.stage{background:#fdfbf7;border:1px solid #f0ebe2;border-radius:13px;padding:10px}
.stage svg{width:100%;height:auto}
.ctl{display:flex;align-items:center;gap:10px;margin:10px 2px 0}
.ctl button{font-size:12.5px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);
 background:var(--card);color:var(--ink2)}
.ctl button:active{background:var(--amber-s)}
.ctl .prog{margin-left:auto;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.cap{margin:12px 0 0;font-size:12.8px;color:var(--ink2)}
.cap b{color:var(--amber);font-weight:600;margin-right:5px}
ul.pts{margin:10px 0 0;padding-left:20px;font-size:13.4px;color:var(--ink2)}
ul.pts li{margin:3px 0}
ul.pts li::marker{color:var(--amber)}
.trap{margin:11px 0 0;font-size:12.8px;color:#8a4a2f;background:#fdf0e9;
 border-left:3px solid #d98455;border-radius:0 7px 7px 0;padding:7px 11px}
.aud{margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px}
audio{width:100%;height:38px}
.hint{margin:9px 0 0;font-size:11.5px;color:var(--ink3);text-align:center}
.sheet footer{display:flex;align-items:center;gap:10px;padding:16px 18px 0;font-size:12.5px}
.sheet footer button{border:1px solid var(--line);background:var(--card);border-radius:9px;
 padding:7px 16px;color:var(--ink2)}
.sheet footer .cnt{margin-left:auto;color:var(--ok);font-size:12px}

/* 逐笔浮现 */
.st{opacity:0;animation:pop .54s cubic-bezier(.22,.72,.32,1) forwards}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.done .st{animation:none!important;opacity:1!important;transform:none!important}
@media(prefers-reduced-motion:reduce){.st{animation-duration:.01s}}
.foot{max-width:980px;margin:8px auto 0;padding:14px 18px 30px;border-top:1px solid var(--line)}
.foot p{margin:0 0 6px;font-size:12px;color:var(--ink3)}
.foot a{color:var(--amber);text-decoration:none}
@media(max-width:520px){
 .grid{grid-template-columns:1fr}
 .top .in,main{padding-left:14px;padding-right:14px}
 .sheet .bd,.sheet header,.sheet footer{padding-left:14px;padding-right:14px}
}
@media(min-width:760px){.sheet{align-items:center}.sheet-in{border-radius:18px;max-height:90vh}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="hrow"><h1>AMC 10 · 金句与补丁</h1><span class="sub" id="hsub"></span></div>
  <div class="pbar"><i id="pbar"></i></div>
  <div class="pstat"><span>已过 <b id="pnum">0</b> / <span id="ptot">0</span></span>
    <span id="pleft"></span></div>
  <div class="plast" id="plast"></div>
  <div class="chips">
    <button data-f="all" class="on">全部</button>
    <button data-f="todo">没看过</button>
    <button data-f="done">看过的</button>
    <button data-f="anim">动画</button>
    <button data-f="audio">语音</button>
    <button id="go" class="go">继续没看的 →</button>
    <select id="mod"><option value="">按模块…</option></select>
    <span class="cstat" id="cstat">连接中…</span>
  </div>
</div></div>

<main id="list"></main>

<footer class="foot">
  <p>金句 215 条 + 考纲补丁 23 条。有图的按画的顺序一笔一笔出来，没图的配一段语音。</p>
  <p><a href="../kp/">← 63 集知识点小视频</a></p>
</footer>

<div class="sheet" id="sheet" hidden>
  <div class="mask" id="mask"></div>
  <div class="sheet-in">
    <header><span class="code" id="s-code"></span><span class="mod" id="s-mod"></span>
      <button class="x" id="s-x" aria-label="关闭">✕</button></header>
    <div class="bd" id="s-bd"></div>
    <footer><button id="s-prev">上一条</button><button id="s-next">下一条</button>
      <span class="cnt" id="s-cnt"></span></footer>
  </div>
</div>

<script src="figs.js"></script>
<script src="data.js"></script>
<script>
(function(){
"use strict";
var UNITS = window.UNITS || [], FIGS = window.FIGS || {};
var MODS = window.MODS || [];
var KEY = 'amc_jinju_v1';
var counts = {}, filter = 'all', modFilter = '';
// 家长用 ?view=1 打开：只看进度，点开任何一条都不计数
var READONLY = /[?&]view=1(&|$)/.test(location.search);

/* ── 本地计数 ── */
function load(){
  try { counts = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ counts = {}; }
  Object.keys(counts).forEach(function(k){
    var v = counts[k];
    if (typeof v === 'number') counts[k] = { n: v|0, t: 0 };
  });
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(counts)); } catch(e){} }
function cnt(id){ var v = counts[id]; return v ? (v.n|0) : 0; }

/* ── 渲染 ── */
var list = document.getElementById('list');
var byId = {};
UNITS.forEach(function(u){ byId[u.i] = u; });

function visible(u){
  var n = cnt(u.i);
  if (filter === 'todo' && n > 0) return false;
  if (filter === 'done' && n === 0) return false;
  if (filter === 'anim' && u.k !== 'anim') return false;
  if (filter === 'audio' && u.k !== 'audio') return false;
  if (modFilter && u.m !== modFilter) return false;
  return true;
}

function cardHTML(u){
  var n = cnt(u.i);
  var kind = u.k === 'anim' ? '<i>▶</i>动画' : '<i>♪</i>语音';
  var code = u.i.charAt(0) === 'P' ? u.no : u.no;
  return '<article class="card' + (n > 0 ? ' done' : '') + '" data-id="' + u.i +
    '" data-k="' + u.k + '"><div class="row"><span class="code">' + code + '</span>' +
    '<span class="mod">' + esc(u.s || u.m) + '</span><span class="kind">' + kind + '</span>' +
    '<span class="n">×' + n + '</span></div><p class="q">' + esc(u.q) + '</p></article>';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  var order = MODS.slice();
  var groups = {};
  UNITS.forEach(function(u){ (groups[u.m] = groups[u.m] || []).push(u); });
  var html = '', shown = 0;
  order.forEach(function(m){
    var items = (groups[m] || []).filter(visible);
    if (!items.length) return;
    shown += items.length;
    var done = items.filter(function(u){ return cnt(u.i) > 0; }).length;
    html += '<section><h2>' + esc(m) + ' <em>' + done + '/' + items.length + '</em></h2><div class="grid">' +
      items.map(cardHTML).join('') + '</div></section>';
  });
  list.innerHTML = shown ? html : '<p class="empty">这个筛选下没有条目。</p>';
  paintStat();
}
function paintStat(){
  var tot = UNITS.length, done = 0;
  UNITS.forEach(function(u){ if (cnt(u.i) > 0) done++; });
  document.getElementById('ptot').textContent = tot;
  document.getElementById('pnum').textContent = done;
  document.getElementById('pbar').style.width = (tot ? done * 100 / tot : 0) + '%';
  document.getElementById('pleft').textContent = done >= tot ? '全部过完了' : ('还剩 ' + (tot - done) + ' 条');
  document.getElementById('hsub').textContent = (READONLY ? '只看模式 · 不计数　' : '') + '动画 ' + UNITS.filter(function(u){return u.k==='anim'}).length +
    ' · 语音 ' + UNITS.filter(function(u){return u.k==='audio'}).length;
  paintLast();
}
function ago(ms){
  var d = (Date.now() - ms) / 1000;
  if (d < 90) return '刚刚';
  if (d < 3600) return Math.round(d / 60) + ' 分钟前';
  if (d < 86400) return Math.round(d / 3600) + ' 小时前';
  return Math.round(d / 86400) + ' 天前';
}
function paintLast(){
  var el = document.getElementById('plast');
  if (!el) return;
  var best = null;
  Object.keys(counts).forEach(function(k){
    var v = counts[k];
    if (!v || !v.t || !byId[k]) return;
    if (!best || v.t > counts[best].t) best = k;
  });
  el.innerHTML = best
    ? '最近看过　<em>' + esc(byId[best].m + ' · ' + byId[best].no) + '</em>　' + ago(counts[best].t)
    : '';
}
function refreshHeads(){
  Array.prototype.forEach.call(list.querySelectorAll('section'), function(sec){
    var cards = sec.querySelectorAll('.card');
    var done = sec.querySelectorAll('.card.done').length;
    var em = sec.querySelector('h2 em');
    if (em) em.textContent = done + '/' + cards.length;
  });
}
function repaintCard(id){
  var el = list.querySelector('.card[data-id="' + id + '"]');
  if (!el) return;
  var n = cnt(id);
  el.classList.toggle('done', n > 0);
  var b = el.querySelector('.n'); if (b) b.textContent = '×' + n;
}

list.addEventListener('click', function(e){
  var c = e.target.closest('.card');
  if (c) open(c.getAttribute('data-id'));
});

/* ── 筛选 ── */
Array.prototype.forEach.call(document.querySelectorAll('.chips button'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('.chips button'), function(x){ x.classList.remove('on'); });
    b.classList.add('on'); filter = b.getAttribute('data-f'); render();
  });
});
var msel = document.getElementById('mod');
MODS.forEach(function(m){
  if (!UNITS.some(function(u){ return u.m === m; })) return;
  var o = document.createElement('option'); o.value = m; o.textContent = m; msel.appendChild(o);
});
msel.addEventListener('change', function(){ modFilter = msel.value; render(); });

document.getElementById('go').addEventListener('click', function(){
  var seq = [];
  MODS.forEach(function(m){
    var g = UNITS.filter(function(u){ return u.m === m; });
    g.forEach(function(u){ seq.push(u); });
  });
  var pick = null;
  if (modFilter) pick = seq.filter(function(u){ return u.m === modFilter && cnt(u.i) === 0; })[0];
  if (!pick) pick = seq.filter(function(u){ return cnt(u.i) === 0; })[0];
  if (!pick){
    var done = UNITS.every(function(u){ return cnt(u.i) > 0; });
    if (done) alert('238 条全过完了。');
    return;
  }
  open(pick.i);
});

/* ── 播放层 ── */
var sheet = document.getElementById('sheet'), bd = document.getElementById('s-bd');
var curId = null, curTimer = null, countedThisOpen = false, audioEl = null;

function open(id){
  curId = id; countedThisOpen = false;
  var u = byId[id]; if (!u) return;
  clearTimeout(curTimer);
  sheet.setAttribute('data-k', u.k);
  document.getElementById('s-code').textContent = u.no;
  document.getElementById('s-mod').textContent = u.m + ' · ' + (u.s || '');
  document.getElementById('s-cnt').textContent = cnt(id) > 0 ? ('已过 ' + cnt(id) + ' 次') : '';
  bd.innerHTML = '';
  if (u.k === 'anim') buildAnim(u); else buildAudio(u);
  sheet.hidden = false;
  requestAnimationFrame(function(){ sheet.classList.add('in'); });
  document.body.style.overflow = 'hidden';
  sheet.querySelector('.sheet-in').scrollTop = 0;
}
function close(){
  sheet.classList.remove('in');
  document.body.style.overflow = '';
  clearTimeout(curTimer);
  if (audioEl){ audioEl.pause(); audioEl = null; }
  setTimeout(function(){ sheet.hidden = true; bd.innerHTML = ''; }, 210);
}
document.getElementById('s-x').addEventListener('click', close);
document.getElementById('mask').addEventListener('click', close);
document.addEventListener('keydown', function(e){
  if (sheet.hidden) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});

function step(d){
  var i = UNITS.findIndex(function(u){ return u.i === curId; });
  var j = (i + d + UNITS.length) % UNITS.length;
  open(UNITS[j].i);
}
document.getElementById('s-prev').addEventListener('click', function(){ step(-1); });
document.getElementById('s-next').addEventListener('click', function(){ step(1); });

/* 动画：按绘制顺序逐笔浮现 */
function buildAnim(u){
  var extra = '';
  if (u.pts) extra += '<ul class="pts">' + u.pts.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
  if (u.trap) extra += '<p class="trap"><b>容易错：</b>' + esc(u.trap) + '</p>';
  if (u.cap) extra += '<p class="cap"><b>读图</b>' + esc(u.cap) + '</p>';
  bd.innerHTML = '<p class="q">' + esc(u.q) + '</p>' +
    '<div class="stage" id="stage"></div>' +
    '<div class="ctl"><button id="replay">重播</button><button id="allshow">全部显示</button>' +
    '<span class="prog" id="prog"></span></div>' + extra;
  play();

  function play(){
    var stage = document.getElementById('stage');
    stage.classList.remove('done');
    stage.innerHTML = FIGS[u.i] || '<p class="empty">图缺失</p>';
    var svg = stage.querySelector('svg');
    if (!svg) return;
    var kids = Array.prototype.slice.call(svg.children)
      .filter(function(el){ return el.tagName.toLowerCase() !== 'defs'; });
    var n = kids.length || 1;
    var stepMs = Math.max(48, Math.min(140, Math.round(3000 / n)));
    kids.forEach(function(el, i){
      el.classList.add('st');
      el.style.animationDelay = (i * stepMs) + 'ms';
    });
    var prog = document.getElementById('prog');
    if (prog) prog.textContent = '1 / ' + n;
    var t0 = Date.now();
    clearInterval(play.tick);
    play.tick = setInterval(function(){
      if (!document.getElementById('prog')) { clearInterval(play.tick); return; }
      var k = Math.min(n, Math.floor((Date.now() - t0) / stepMs) + 1);
      document.getElementById('prog').textContent = k + ' / ' + n;
      if (k >= n){ clearInterval(play.tick); }
    }, 90);
    clearTimeout(curTimer);
    curTimer = setTimeout(function(){ markView(u.i); }, n * stepMs + 620);
  }
  document.getElementById('replay').onclick = play;
  document.getElementById('allshow').onclick = function(){
    var stage = document.getElementById('stage');
    stage.classList.add('done');
    var svg = stage.querySelector('svg');
    var n = svg ? Array.prototype.slice.call(svg.children)
      .filter(function(el){ return el.tagName.toLowerCase() !== 'defs'; }).length : 1;
    var prog = document.getElementById('prog'); if (prog) prog.textContent = n + ' / ' + n;
    clearInterval(play.tick); clearTimeout(curTimer);
    markView(u.i);
  };
}

/* 语音：听完 70% 记一次 */
function buildAudio(u){
  var extra = '';
  if (u.pts) extra += '<ul class="pts">' + u.pts.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
  if (u.trap) extra += '<p class="trap"><b>容易错：</b>' + esc(u.trap) + '</p>';
  bd.innerHTML = '<p class="q">' + esc(u.q) + '</p>' + extra +
    '<div class="aud"><audio controls preload="auto" id="au" src="vo/' + u.i + '.mp3"></audio>' +
    '<p class="hint">听完就记一次 · 也可以边听边看上面的句子</p></div>';
  audioEl = document.getElementById('au');
  var done = false;
  function chk(){
    if (done || !audioEl) return;
    var d = audioEl.duration;
    if (d && audioEl.currentTime / d >= 0.7){
      done = true; markView(u.i);
    }
  }
  audioEl.addEventListener('timeupdate', chk);
  audioEl.addEventListener('ended', function(){ if (!done){ done = true; markView(u.i); } });
  audioEl.addEventListener('error', function(){
    var h = document.querySelector('.hint');
    if (h) h.textContent = '这段语音没加载出来（检查网络后重开一次）';
  });
}

/* ── 记一次 ── */
function markView(id){
  if (READONLY || countedThisOpen) return;
  countedThisOpen = true;
  counts[id] = { n: cnt(id) + 1, t: Date.now() };
  save();
  repaintCard(id);
  paintStat();
  refreshHeads();
  document.getElementById('s-cnt').textContent = '已过 ' + cnt(id) + ' 次';
  pushOne(id);
}
/* ── 云同步：经同源中继 ── */
var RELAY_ORIGIN = 'https://amc10-kp.app.workbuddy.host';
var RELAY_SRC = RELAY_ORIGIN + '/relay.html?sharecode=63GNEIHANS&v=2';
var relayFrame = null, relayUp = false, seq = 0, pend = {}, started = false, pushT = {};

function cset(cls, text){
  var el = document.getElementById('cstat');
  el.className = 'cstat ' + cls; el.textContent = text;
}
function relayCall(method, qs, body, cb){
  var w = relayFrame && relayFrame.contentWindow;
  if (!relayUp || !w){ if (cb) cb({ ok: false, err: 'no-relay' }); return; }
  var id = 'j' + (++seq);
  pend[id] = cb;
  setTimeout(function(){ if (pend[id]){ delete pend[id]; if (cb) cb({ ok: false, err: 'timeout' }); } }, 9000);
  w.postMessage({ t: 'kp', tbl: 'jinju_seen', id: id, method: method, qs: qs || '', body: body || '' }, RELAY_ORIGIN);
}
function onMsg(e){
  if (e.origin !== RELAY_ORIGIN) return;
  var d = e.data || {};
  if (d.t !== 'kp') return;
  if (d.ready){ relayUp = true; cset('', '连接中…'); pull(true); return; }
  var cb = pend[d.id];
  if (cb){ delete pend[d.id]; cb(d); }
}
function pull(first){
  if (!relayUp) return;
  relayCall('GET', '?select=no,n', '', function(res){
    if (!res || !res.ok){ cset('err', '同步失败'); return; }
    var rows = [];
    try { rows = JSON.parse(res.body) || []; } catch(e){ cset('err', '同步失败'); return; }
    var changed = false;
    rows.forEach(function(r){
      var no = r.no, n = r.n | 0, rt = r.t ? Date.parse(r.t) : 0;
      if (!no || n <= 0 || !byId[no]) return;          // 不认识的编号直接丢（防别的表混进来）
      var lc = counts[no] || { n: 0, t: 0 };
      var nn = Math.max(n, lc.n), nt = Math.max(rt || 0, lc.t || 0);
      if (nn !== lc.n || nt !== lc.t){ counts[no] = { n: nn, t: nt }; changed = true; }
    });
    if (changed){ save(); render(); }
    cset('ok', '云端 ' + rows.length + ' 条');
    if (first) syncAll();
  });
}
function pushOne(id){
  if (!relayUp) return;
  clearTimeout(pushT[id]);
  pushT[id] = setTimeout(function(){
    relayCall('POST', '', JSON.stringify([{ no: id, n: cnt(id),
        kind: (byId[id] || {}).k || '', t: new Date(counts[id].t || Date.now()).toISOString() }]),
      function(res){ cset(res && res.ok ? 'ok' : 'err', res && res.ok ? '已同步' : '同步失败'); });
  }, 700);
}
function syncAll(){
  if (!relayUp) return;
  var rows = Object.keys(counts).map(function(k){ return { no: k, n: cnt(k),
      kind: (byId[k] || {}).k || '', t: new Date((counts[k] && counts[k].t) || Date.now()).toISOString() }; })
    .filter(function(r){ return r.n > 0 && byId[r.no]; });
  if (!rows.length) return;
  relayCall('POST', '', JSON.stringify(rows), function(res){
    cset(res && res.ok ? 'ok' : 'err', res && res.ok ? ('已同步 ' + rows.length + ' 条') : '同步失败');
  });
}
function startRelay(){
  if (started) return; started = true;
  window.addEventListener('message', onMsg);
  var f = document.createElement('iframe');
  f.src = RELAY_SRC; f.setAttribute('aria-hidden', 'true'); f.setAttribute('tabindex', '-1');
  f.style.cssText = 'position:absolute;width:1px;height:1px;border:0;left:-9999px;top:-9999px';
  document.body.appendChild(f); relayFrame = f;
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) pull(false); });
  setInterval(function(){ if (!document.hidden) pull(false); }, 30000);
  setTimeout(function(){ if (!relayUp) cset('err', '仅本机记录'); }, 12000);
}

load();
// 清掉历史遗留的陌生编号（旧版中继串表时把 kp 的 B08/R01 之类写进了本机）
var dirty = Object.keys(counts).filter(function(k){ return !byId[k]; });
if (dirty.length){ dirty.forEach(function(k){ delete counts[k]; }); save(); }
render(); startRelay();
})();
</script>
