<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMC10知识点_B04_整除判别</title>
<style>
:root{
  --bg1:#0a182e; --bg2:#0d2a4a; --ink:#eaf2ff; --ink2:#9fb3cf; --ink3:#6a7f9c;
  --card:#ffffff; --cink:#1f2937; --csub:#64748b;
  --soft:#f0f5fc; --amberbg:#fef3e2;
  --sky:#7dd3fc; --amber:#f59e0b; --blue:#3b82f6; --red:#ef4444; --green:#22c55e;
  --line:#22405f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(1000px 700px at 50% -8%, #16375c 0%, var(--bg1) 60%);
  background-attachment:fixed; color:var(--ink); min-height:100vh;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  display:flex; justify-content:center; padding:16px 14px 20px;
  -webkit-font-smoothing:antialiased;
}
.app{width:100%;max-width:620px;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 36px)}

/* 顶部 */
.top{display:flex;align-items:center;gap:10px}
.chip{background:#3a5484;color:#d6e6fc;font-size:12.5px;font-weight:700;
  padding:6px 13px;border-radius:999px;white-space:nowrap}
.pg{margin-left:auto;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:flex;gap:4px;margin-top:2px}
.bar i{flex:1;height:5px;border-radius:3px;background:#2b4a6e;transition:background .3s}
.bar i.on{background:var(--sky)}

/* 舞台 */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0 8px;min-height:340px}

/* 封面 / 结尾 */
.center{text-align:center;padding:14px 0}
.badge{display:inline-block;color:var(--sky);font-size:13px;font-weight:700;
  letter-spacing:.08em;margin-bottom:16px}
.center h1{font-size:29px;line-height:1.35;letter-spacing:.06em;font-weight:700}
.hr{width:88px;height:3px;background:var(--sky);border-radius:2px;margin:20px auto}
.cdate{color:var(--ink2);font-size:14px;margin-bottom:16px}
.pill{display:inline-block;background:#3a5484;color:#d6e6fc;font-size:13.5px;
  padding:9px 20px;border-radius:999px}
.star{font-size:54px;color:var(--sky);margin-bottom:18px}
.msg{font-size:23px;font-weight:700;line-height:1.5}
.msgs{font-size:14px;color:var(--ink2);margin-top:14px;line-height:1.6}

/* 内容幕 */
.kick{display:inline-block;background:#34507c;color:#bed6f8;font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:999px;margin-bottom:12px}
.h2{font-size:22px;font-weight:700;line-height:1.42;margin-bottom:16px}
.h2::after{content:"";display:block;width:56px;height:3px;background:var(--sky);
  border-radius:2px;margin-top:10px}

.panel{background:var(--card);border-radius:16px;padding:15px 16px;margin-bottom:11px;
  box-shadow:0 10px 26px rgba(0,0,0,.24)}
.panel.soft{background:var(--soft)}
.panel.amber{background:var(--amberbg)}
.item{display:flex;gap:9px;margin-bottom:9px;font-size:15px;line-height:1.62;color:var(--cink)}
.item:last-child{margin-bottom:0}
.item .dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:8px}
.d-bul{background:var(--blue)} .d-red{background:var(--red)}
.d-green{background:var(--green)} .d-amber{background:var(--amber)}
.item.fml{background:#1e2b44;color:#e2eeff;border-radius:10px;padding:12px 14px;
  font-size:16px;font-weight:600;letter-spacing:.02em;
  font-family:"Cambria Math","Cambria","Times New Roman",serif;
  display:block}
.item.tip{background:#fdf0dc;border-left:4px solid var(--amber);border-radius:8px;
  padding:11px 13px;color:#8a5a10;display:block;font-size:14.5px}
.item.key{background:#e8f1fe;border-left:4px solid var(--blue);border-radius:8px;
  padding:11px 13px;color:#17417b;display:block;font-weight:700;font-size:15px}

/* 演示幕 */
.stem{background:var(--soft);border-left:5px solid var(--blue);border-radius:12px;
  padding:14px 16px;color:var(--cink);font-size:16.5px;line-height:1.6;margin-bottom:12px}
.steps{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 10px 26px rgba(0,0,0,.24)}
.step{display:flex;gap:11px;margin-bottom:13px;font-size:15px;line-height:1.6;color:var(--cink)}
.step:last-child{margin-bottom:0}
.step .num{flex:0 0 26px;height:26px;border-radius:50%;background:#e8f1fe;color:#17417b;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.trap{background:var(--amberbg);border-left:5px solid var(--amber);border-radius:12px;
  padding:13px 15px;color:#8a5a10;font-size:14.5px;line-height:1.6;margin-top:12px}

/* 金句 */
.qcard{background:#fffaf0;border-radius:18px;padding:26px 22px;position:relative;
  box-shadow:0 14px 34px rgba(0,0,0,.3);border-left:6px solid var(--amber)}
.qcard .qm{position:absolute;top:6px;left:12px;font-size:54px;color:#f5c88a;line-height:1}
.qcard p{font-size:19px;font-weight:700;line-height:1.75;color:#28283c;
  text-align:center;padding-left:14px;letter-spacing:.01em}
.empty{color:var(--ink3);font-size:14px;text-align:center;padding:30px 0}

/* 控制条 */
.ctrl{display:flex;gap:9px;align-items:center}
.btn{flex:1;background:rgba(125,211,252,.11);color:#a8e2ff;border:1px solid rgba(125,211,252,.38);
  border-radius:12px;padding:13px 10px;font-size:15px;font-weight:700;font-family:inherit;
  cursor:pointer;transition:.16s}
.btn:hover:not(:disabled){background:rgba(125,211,252,.2)}
.btn:disabled{opacity:.34;cursor:default}
.btn.voice{flex:0 0 auto;padding:13px 14px;font-size:13.5px}
.btn.voice.on{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.5);color:#fbc96b}
.dots{display:flex;gap:7px;justify-content:center;padding:9px 0 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:#2b4a6e;transition:.2s}
.dots i.on{background:var(--sky);transform:scale(1.25)}
@media(max-width:400px){
  .h2{font-size:19px} .center h1{font-size:23px}
  .item,.step{font-size:14px} .qcard p{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="chip">AMC10 · 数论 · B04</span>
    <span class="pg" id="pg">1 / 1</span>
  </div>
  <div class="bar" id="bar"></div>

  <div class="stage" id="stage"></div>

  <div class="dots" id="dots"></div>

  <div class="ctrl">
    <button class="btn" id="prev">← 上一步</button>
    <button class="btn voice on" id="voice">讲解 开</button>
    <button class="btn" id="next">下一步 →</button>
  </div>
</div>

<script>
(function(){
  var A = KP.audio || {};
  var fr = KP.frames, sc = KP.scenes;
  var cur = 0, voiceOn = true, playingScene = -1, audioEl = null;
  var total = sc.length;

  var stage = document.getElementById('stage');
  var barEl = document.getElementById('bar');
  var pgEl  = document.getElementById('pg');
  var dotsEl= document.getElementById('dots');
  var prevB = document.getElementById('prev');
  var nextB = document.getElementById('next');
  var voiceB= document.getElementById('voice');

  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined && txt !== null) e.textContent = txt;
    return e;
  }
  function strip(s){ return String(s == null ? '' : s); }

  // ---------- 各幕渲染 ----------
  function renderCover(s){
    var w = el('div','center');
    w.appendChild(el('div','badge',strip(s.badge)));
    w.appendChild(el('h1', null, strip(s.title)));
    w.appendChild(el('div','hr'));
    w.appendChild(el('div','cdate',strip(s.date)));
    if (s.pill) w.appendChild(el('div','pill',strip(s.pill)));
    return w;
  }

  function renderEnd(s){
    var w = el('div','center');
    w.appendChild(el('div','star', strip(s.emoji || '★')));
    (s.msg || []).forEach(function(m){ w.appendChild(el('div','msg',strip(m))); });
    if (s.sub) w.appendChild(el('div','msgs',strip(s.sub)));
    return w;
  }

  function renderQuote(s){
    var w = el('div');
    if (s.kicker) w.appendChild(el('div','kick',strip(s.kicker)));
    var c = el('div','qcard');
    c.appendChild(el('div','qm','“'));
    var p = el('p');
    strip(s.text).split('\n').forEach(function(ln, i){
      if (i) p.appendChild(document.createElement('br'));
      p.appendChild(document.createTextNode(ln));
    });
    c.appendChild(p);
    w.appendChild(c);
    return w;
  }

  function itemNode(kind, text){
    var k = strip(kind), t = strip(text);
    if (k === 'fml')  return el('div','item fml', t);
    if (k === 'tip')  return el('div','item tip', t);
    if (k === 'key')  return el('div','item key', t);
    var row = el('div','item');
    row.appendChild(el('span','dot d-' + (k === 'bul' ? 'bul' : k)));
    var sp = el('span', null, t);
    row.appendChild(sp);
    return row;
  }

  function renderContent(s, shown){
    var w = document.createElement('div');
    if (s.kicker) w.appendChild(el('div','kick',strip(s.kicker)));
    w.appendChild(el('h2','h2', strip(s.title)));
    var left = shown;
    (s.panels || []).forEach(function(p){
      if (left <= 0) return;
      var items = p.items || [];
      var box = el('div','panel ' + (p.bg || 'white'));
      var take = Math.min(left, items.length);
      for (var i = 0; i < take; i++) box.appendChild(itemNode(items[i][0], items[i][1]));
      if (take > 0) w.appendChild(box);
      left -= take;
    });
    return w;
  }

  function renderDemo(s, step){
    var w = document.createElement('div');
    if (s.kicker) w.appendChild(el('div','kick',strip(s.kicker)));
    w.appendChild(el('h2','h2', strip(s.title)));
    if (s.stem){
      var stem = el('div','stem');
      s.stem.forEach(function(x, i){
        if (i) stem.appendChild(document.createElement('br'));
        stem.appendChild(document.createTextNode(strip(x)));
      });
      w.appendChild(stem);
    }
    var steps = s.steps || [];
    var shown = Math.min(step, steps.length);
    if (shown > 0){
      var box = el('div','steps');
      for (var i = 0; i < shown; i++){
        var row = el('div','step');
        row.appendChild(el('div','num', String(i+1)));
        row.appendChild(el('div', null, strip(steps[i].show !== undefined ? steps[i].show : steps[i])));
        box.appendChild(row);
      }
      w.appendChild(box);
    }
    if (s.trap && step >= steps.length) w.appendChild(el('div','trap', strip(s.trap)));
    return w;
  }

  // ---------- 渲染当前帧 ----------
  function draw(){
    var f = fr[cur], s = sc[f.s], t = s.type || 'content';
    var node;
    if (t === 'cover')      node = renderCover(s);
    else if (t === 'end')   node = renderEnd(s);
    else if (t === 'quote') node = renderQuote(s);
    else if (t === 'demo')  node = renderDemo(s, f.n);
    else                    node = renderContent(s, f.n);

    stage.innerHTML = '';
    stage.appendChild(node);

    // 进度条（按幕）
    barEl.innerHTML = '';
    for (var i = 0; i < total; i++){
      var b = document.createElement('i');
      if (i <= f.s) b.className = 'on';
      barEl.appendChild(b);
    }
    pgEl.textContent = (f.s + 1) + ' / ' + total;

    // 底部步数点（当前幕内）
    dotsEl.innerHTML = '';
    var cnt = 1;
    if (t === 'demo') cnt = (s.steps || []).length + 1;
    else if (t === 'content') cnt = (s.panels || []).reduce(function(a,p){ return a + (p.items||[]).length; }, 0) + 1;
    if (cnt > 1){
      for (var j = 0; j < cnt; j++){
        var d = document.createElement('i');
        if (j < f.n) d.className = 'on';
        dotsEl.appendChild(d);
      }
    }

    prevB.disabled = (cur === 0);
    nextB.disabled = (cur === fr.length - 1);
    nextB.textContent = (cur === fr.length - 1) ? '已到结尾' : '下一步 →';

    if (voiceOn) maybePlay(f.s);
  }

  // ---------- 旁白：按幕播放，同幕内翻帧不重播 ----------
  function stopAudio(){
    if (audioEl){ try { audioEl.pause(); } catch(e){} }
    playingScene = -1;
  }
  function maybePlay(si){
    if (!voiceOn || si === playingScene || !A[String(si)]) return;
    stopAudio();
    playingScene = si;
    audioEl = new Audio(A[String(si)]);
    var pr = audioEl.play();
    if (pr && pr.catch) pr.catch(function(){});
  }

  // ---------- 导航 ----------
  function go(n){
    var v = Math.max(0, Math.min(fr.length - 1, n));
    if (v === cur) return;
    cur = v; draw();
  }
  prevB.addEventListener('click', function(){ go(cur - 1); });
  nextB.addEventListener('click', function(){ go(cur + 1); });
  voiceB.addEventListener('click', function(){
    voiceOn = !voiceOn;
    voiceB.textContent = voiceOn ? '讲解 开' : '讲解 关';
    voiceB.classList.toggle('on', voiceOn);
    if (voiceOn) maybePlay(fr[cur].s); else stopAudio();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); go(cur - 1); }
  });

  // 触摸左右滑动
  var tx = null;
  stage.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 55) go(cur + (dx < 0 ? 1 : -1));
    tx = null;
  }, {passive:true});

  voiceB.textContent = '讲解 开';
  voiceB.classList.add('on');
  draw();
})();
</script>
</body>
</html>
