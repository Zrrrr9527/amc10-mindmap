<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三角形不等式与翻折 · AMC10 几何</title>
<style>
:root{
  --bg1:#08132a; --bg2:#0d2a4a; --ink:#eaf2ff; --ink2:#9fb3cf; --ink3:#6a7f9c;
  --sky:#7dd3fc; --amber:#fbbf24; --green:#34d399; --red:#f87171; --violet:#c4b5fd;
  --line:#22405f; --card:rgba(255,255,255,.055);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(1200px 700px at 50% -10%, #123d6b 0%, var(--bg2) 42%, var(--bg1) 100%);
  color:var(--ink); min-height:100vh;
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px; margin:0 auto; padding:18px 14px 46px}
.head{text-align:center; margin-bottom:12px}
.chip{display:inline-block; font-size:12px; letter-spacing:.5px; color:#bcd7f5;
  background:rgba(125,211,252,.13); border:1px solid rgba(125,211,252,.28);
  padding:4px 12px; border-radius:999px}
h1{font-size:22px; line-height:1.35; margin:10px 0 4px; letter-spacing:.5px}
.sub{color:var(--ink2); font-size:13px; margin:0}

.stage{position:relative; background:var(--card); border:1px solid rgba(125,211,252,.16);
  border-radius:18px; overflow:hidden; box-shadow:0 18px 42px rgba(0,0,0,.34)}
.stage canvas{display:block; width:100%; height:auto; aspect-ratio:7/5; touch-action:none; cursor:default}
.tip{position:absolute; left:12px; top:10px; font-size:12px; color:#a8c6e6;
  background:rgba(8,19,42,.62); border:1px solid rgba(125,211,252,.18);
  padding:4px 10px; border-radius:999px; pointer-events:none}
.tip b{color:var(--amber)}

.ro{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px}
.kv{flex:1 1 128px; min-width:120px; background:var(--card); border:1px solid rgba(125,211,252,.13);
  border-radius:12px; padding:9px 12px}
.kv .k{font-size:11px; color:var(--ink3); letter-spacing:.4px}
.kv .v{font-size:19px; font-weight:700; margin-top:2px; color:var(--ink); font-variant-numeric:tabular-nums}
.kv .v small{font-size:12px; font-weight:400; color:var(--ink2); margin-left:3px}
.kv.on{border-color:rgba(52,211,153,.45); background:rgba(52,211,153,.10)}
.kv.on .v{color:#6ee7b7}
.kv.warn{border-color:rgba(251,191,36,.45); background:rgba(251,191,36,.10)}
.kv.warn .v{color:#fcd34d}

.ctl{display:flex; flex-direction:column; gap:10px; margin:12px 0 6px}
.row{display:flex; align-items:center; gap:12px; background:var(--card);
  border:1px solid rgba(125,211,252,.10); border-radius:12px; padding:8px 12px}
.row label{font-size:13px; color:var(--ink2); min-width:74px; white-space:nowrap}
.row input[type=range]{flex:1; -webkit-appearance:none; height:4px; border-radius:3px;
  background:linear-gradient(90deg,var(--sky),#3b82f6); outline:none; min-width:0}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:17px; height:17px;
  border-radius:50%; background:#fff; border:3px solid #0b2748; box-shadow:0 2px 8px rgba(0,0,0,.4); cursor:pointer}
.row input[type=range]::-moz-range-thumb{width:15px; height:15px; border-radius:50%; background:#fff;
  border:3px solid #0b2748; cursor:pointer}
.row .out{font-size:14px; font-weight:700; color:var(--amber); min-width:52px; text-align:right;
  font-variant-numeric:tabular-nums}
.seg{display:flex; flex-wrap:wrap; gap:7px}
.seg button{flex:1 1 auto; font:inherit; font-size:13px; padding:8px 12px; border-radius:10px; cursor:pointer;
  color:var(--ink2); background:rgba(255,255,255,.04); border:1px solid rgba(125,211,252,.16);
  transition:.15s; white-space:nowrap}
.seg button:hover{color:var(--ink); border-color:rgba(125,211,252,.4)}
.seg button.on{color:#062038; background:linear-gradient(180deg,#a5e4ff,#7dd3fc); border-color:#7dd3fc; font-weight:700}

.step{margin-top:14px; background:linear-gradient(180deg,rgba(125,211,252,.10),rgba(125,211,252,.03));
  border:1px solid rgba(125,211,252,.18); border-radius:16px; padding:14px 16px 15px}
.snum{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.snum i{width:7px; height:7px; border-radius:50%; background:rgba(125,211,252,.28); display:block}
.snum i.on{background:var(--sky); box-shadow:0 0 10px rgba(125,211,252,.8)}
.snum span{margin-left:auto; font-size:11px; color:var(--ink3)}
.step h2{font-size:16px; margin:0 0 7px; color:#cfe6ff}
.step p{margin:0; font-size:15px; line-height:1.72; color:#dbe8f7}
.step p b{color:var(--amber); font-weight:700}
.step p em{font-style:normal; color:#6ee7b7}
.step p code{font-family:Consolas,monospace; background:rgba(125,211,252,.13); padding:1px 5px;
  border-radius:5px; font-size:14px; color:#bfe4ff}
.nav{display:flex; gap:9px; margin-top:12px}
.nav button{flex:1; font:inherit; font-size:14px; padding:10px; border-radius:11px; cursor:pointer;
  color:#062038; background:linear-gradient(180deg,#a5e4ff,#7dd3fc); border:0; font-weight:700}
.nav button.ghost{color:var(--ink2); background:rgba(255,255,255,.05);
  border:1px solid rgba(125,211,252,.18); font-weight:400}
.nav button:disabled{opacity:.38; cursor:not-allowed}
.voice{position:absolute; right:10px; top:10px; font:inherit; font-size:12px; cursor:pointer;
  color:#bcd7f5; background:rgba(8,19,42,.72); border:1px solid rgba(125,211,252,.22);
  padding:5px 11px; border-radius:999px}
.voice.on{color:#062038; background:linear-gradient(180deg,#a5e4ff,#7dd3fc); border-color:#7dd3fc; font-weight:700}
footer{margin-top:18px; text-align:center; font-size:11px; color:var(--ink3); line-height:1.7}
@media (max-width:420px){
  h1{font-size:19px}
  .kv{flex:1 1 45%; min-width:0}
  .kv .v{font-size:17px}
  .row label{min-width:62px; font-size:12px}
  .step p{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="chip">AMC10 · 三角形 · R11</div>
    <h1>三角形不等式与翻折</h1>
    <p class="sub">「和最短」的题，几乎都靠把点翻到对面去</p>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="tip">沿虚线拖 <b>P</b>，看和怎么变</div>
  </div>

  <div class="ro" id="ro"></div>
  <div class="ctl" id="ctl"></div>

  <div class="step">
    <div class="snum" id="dots"></div>
    <h2 id="stitle"></h2>
    <p id="sdesc"></p>
    <div class="nav">
      <button class="ghost" id="prev">← 上一步</button>
      <button id="next">下一步 →</button>
    </div>
    <div class="sfoot" id="sfoot" style="text-align:right;font-size:11px;color:#6a7f9c;margin-top:8px"></div>
  </div>

  <footer>单文件页面 · 双击即可用 · 不需要联网<br>拖动图中橙色手柄，或拉动滑块，数字会跟着实时变</footer>
</div>

<script>window.STEPS = [{"t": "先拖着试试，找最低点", "d": "P 在直线上滑动，PA + PB 先变小、过某个位置又变大。所以一定存在一个<b>最低点</b>——问题是它在哪。", "p": {"px": -1.2}}, {"t": "三角形不等式：折线一定比直线长", "d": "在三角形 ABP 里，<code>PA + PB ≥ AB</code>，等号只在 P 落在 AB 上时成立。可惜 A、B 都在直线同侧，AB 根本不过这条直线。", "p": {"px": 1.8}}, {"t": "把 B 翻到对岸去", "d": "作 B 关于这条直线的对称点 <b>B′</b>。因为翻折不改变距离，所以 <code>PB = PB′</code>。原来的 PA + PB 就变成了 PA + PB′。", "p": {"px": 1.8}}, {"t": "三点拉直，就是最短", "d": "A、P、B′ 三点共线时 <code>PA + PB′ = AB′</code> 最短，而 AB′ 的长度可以直接算。现在 P 正停在金色标记 P* 上，读数里「多走的距离」是 0。", "p": {"opt": true}}, {"t": "一句话", "d": "<b>求「和最短」→ 翻折取直线；求「差最大」→ 也是同一条直线。</b>两个套路共用一条辅助线，只是取的点不同。", "p": {"opt": true}}];</script>
<script>
/* ============ 几何画布内核：坐标 / 图元 / 拖拽 / 滑块 / 步骤 ============ */
window.S = (function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = 700, H = 500, DPR = 1;
  var view = { cx: 0, cy: 0, s: 60 };
  var HS = [], dragging = -1;
  var P = { sky:'#7dd3fc', amber:'#fbbf24', green:'#34d399', red:'#f87171',
            violet:'#c4b5fd', ink:'#eaf2ff', ink2:'#9fb3cf', ink3:'#6a7f9c',
            soft:'rgba(255,255,255,.055)' };

  function f(n){ return Math.max(10, n * Math.min(1.34, Math.max(.92, W/560))); }
  function lw(n){ return Math.max(1, n * Math.min(1.3, Math.max(.9, W/560))); }
  function X(x){ return W/2 + (x - view.cx) * view.s; }
  function Y(y){ return H/2 - (y - view.cy) * view.s; }
  function inv(px, py){ return { x:(px - W/2)/view.s + view.cx, y:(H/2 - py)/view.s + view.cy }; }

  function resize(){
    var w = cv.clientWidth || cv.parentNode.clientWidth || 700;
    var h = cv.clientHeight || Math.round(w * 5 / 7);
    DPR = window.devicePixelRatio || 1;
    if (DPR > 2) DPR = 2;
    W = w; H = h;
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (window.__EP && window.__EP.redraw) window.__EP.redraw();
  }

  /* 让世界坐标 [-hw,hw]x[-hh,hh] 恰好装进画布（留 pad 边距），x、y 同比例 */
  /* hw/hh: 世界半宽半高；cx/cy: 这个世界框的中心（默认原点）
     —— 必须传中心，否则图形会贴顶、下方留一大片空白 */
  function fit(hw, hh, pad, cx, cy){
    pad = pad == null ? 34 : pad;
    view.cx = cx || 0; view.cy = cy || 0;
    view.s = Math.min((W - 2*pad) / (2*hw), (H - 2*pad) / (2*hh));
    return view.s;
  }

  function clear(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a1b33';
    ctx.fillRect(0, 0, W, H);
    // 极淡网格，帮助估长度
    ctx.strokeStyle = 'rgba(125,211,252,.055)'; ctx.lineWidth = 1;
    var g = 40;
    for (var x = 0; x <= W; x += g){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (var y = 0; y <= H; y += g){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    HS = [];
  }

  function line(x1, y1, x2, y2, o){
    o = o || {};
    ctx.save();
    ctx.strokeStyle = o.c || P.sky; ctx.lineWidth = lw(o.w || 2);
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
    ctx.restore();
  }

  function poly(pts, o){
    o = o || {};
    ctx.save();
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++){
      var sx = X(pts[i][0]), sy = Y(pts[i][1]);
      i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
    }
    if (o.close !== false) ctx.closePath();
    if (o.fill){ ctx.fillStyle = o.fill; ctx.fill(); }
    if (o.stroke !== null){
      ctx.strokeStyle = o.stroke || P.sky; ctx.lineWidth = lw(o.w || 2);
      if (o.dash) ctx.setLineDash(o.dash);
      ctx.lineJoin = 'round'; ctx.stroke();
    }
    ctx.restore();
  }

  function circle(cx, cy, r, o){
    o = o || {};
    ctx.save();
    ctx.beginPath(); ctx.arc(X(cx), Y(cy), r * view.s, 0, Math.PI * 2);
    if (o.fill){ ctx.fillStyle = o.fill; ctx.fill(); }
    if (o.stroke !== null){
      ctx.strokeStyle = o.stroke || P.sky; ctx.lineWidth = lw(o.w || 2);
      if (o.dash) ctx.setLineDash(o.dash);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 圆弧：角度用弧度、数学方向（逆时针为正，y 轴向上） */
  function arcPath(cx, cy, r, a0, a1, o){
    o = o || {};
    ctx.save();
    ctx.beginPath();
    ctx.arc(X(cx), Y(cy), r * view.s, -a1, -a0, false);
    if (o.fill){ ctx.fillStyle = o.fill; ctx.fill(); }
    if (o.stroke !== null){
      ctx.strokeStyle = o.stroke || P.sky; ctx.lineWidth = lw(o.w || 2);
      if (o.dash) ctx.setLineDash(o.dash);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 扇形：从中心到两条半径围起来的填充 */
  function sector(cx, cy, r, a0, a1, o){
    o = o || {};
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(X(cx), Y(cy));
    ctx.arc(X(cx), Y(cy), r * view.s, -a1, -a0, false);
    ctx.closePath();
    if (o.fill){ ctx.fillStyle = o.fill; ctx.fill(); }
    if (o.stroke){
      ctx.strokeStyle = o.stroke; ctx.lineWidth = lw(o.w || 1.4); ctx.stroke();
    }
    ctx.restore();
  }

  function dot(x, y, o){
    o = o || {};
    var r = o.r || 4.2;
    ctx.save();
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * (view.s / 60 > 1.2 ? 1.2 : 1) * 1.1, 0, Math.PI * 2);
    ctx.fillStyle = o.c || P.amber; ctx.fill();
    ctx.restore();
  }

  function text(x, y, s, o){
    o = o || {};
    var px = o.px == null ? true : o.px;      // true: 用屏幕像素定位（不适合随缩放）
    var sx = px ? x : X(x), sy = px ? y : Y(y);
    ctx.save();
    ctx.font = (o.bold ? '700 ' : '') + f(o.size || 14) + 'px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = o.base || 'middle';
    if (o.bg){
      var m = ctx.measureText(s);
      var w = m.width + 12, h = f(o.size || 14) + 10;
      var bx = ctx.textAlign === 'left' ? sx - 6 : (ctx.textAlign === 'right' ? sx - w + 6 : sx - w/2);
      ctx.fillStyle = o.bg;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, sy - h/2, w, h, 7); else ctx.rect(bx, sy - h/2, w, h);
      ctx.fill();
    }
    ctx.fillStyle = o.c || P.ink;
    ctx.fillText(s, sx, sy);
    ctx.restore();
  }

  /* 标签：给点用的，带轻微描边保证在深底上可读 */
  function label(x, y, s, o){
    o = o || {};
    ctx.save();
    ctx.font = (o.bold ? '700 ' : '') + f(o.size || 14) + 'px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    var sx = X(x) + (o.dx || 0), sy = Y(y) + (o.dy || 0);
    ctx.lineWidth = 3.2; ctx.strokeStyle = 'rgba(10,27,51,.92)';
    ctx.strokeText(s, sx, sy);
    ctx.fillStyle = o.c || P.ink;
    ctx.fillText(s, sx, sy);
    ctx.restore();
  }

  /* 直角标记：角顶点 v，两边方向 (d1x,d1y) 与 (d2x,d2y)（单位向量） */
  function right(vx, vy, d1x, d1y, d2x, d2y, o){
    o = o || {};
    var k = (o.k || 0.42);
    poly([[vx + d1x*k, vy + d1y*k],
          [vx + d1x*k + d2x*k, vy + d1y*k + d2y*k],
          [vx + d2x*k, vy + d2y*k]],
         {stroke: o.c || P.ink2, w: 1.5, fill: null});
  }

  /* 等长刻线：在两点连线中点画 n 道短垂线 */
  function ticks(x1, y1, x2, y2, n, o){
    o = o || {};
    var mx = (x1+x2)/2, my = (y1+y2)/2;
    var dx = x2-x1, dy = y2-y1, L = Math.hypot(dx, dy) || 1;
    var ux = dx/L, uy = dy/L, nx = -uy, ny = ux;
    var len = 0.16 * (o.len || 1) , gap = 0.13;
    for (var i = 0; i < (n || 1); i++){
      var off = (i - ((n || 1) - 1)/2) * gap;
      var bx = mx + ux*off, by = my + uy*off;
      line(bx - nx*len, by - ny*len, bx + nx*len, by + ny*len, {c: o.c || P.sky, w: 1.6});
    }
  }

  /* 可拖手柄：每帧 draw 里调用；指针在 24px 内按下即可拖 */
  function handle(x, y, cb, o){
    o = o || {};
    var on = dragging === HS.length;
    ctx.save();
    ctx.beginPath();
    ctx.arc(X(x), Y(y), o.r || 9, 0, Math.PI * 2);
    ctx.fillStyle = on ? 'rgba(251,191,36,.95)' : (o.c || 'rgba(251,191,36,.55)');
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = on ? '#fff' : 'rgba(255,255,255,.55)'; ctx.stroke();
    // 十字准心，明确「这里能拖」
    ctx.beginPath();
    ctx.moveTo(X(x) - 4, Y(y)); ctx.lineTo(X(x) + 4, Y(y));
    ctx.moveTo(X(x), Y(y) - 4); ctx.lineTo(X(x), Y(y) + 4);
    ctx.strokeStyle = '#12283f'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();
    HS.push({ x: x, y: y, r: o.hit || 24, cb: cb });
  }

  function ro(items){
    var box = document.getElementById('ro');
    var html = '';
    for (var i = 0; i < items.length; i++){
      var it = items[i];
      html += '<div class="kv ' + (it.cls || '') + '"><div class="k">' + it.k +
              '</div><div class="v">' + it.v + (it.u ? '<small>' + it.u + '</small>' : '') + '</div></div>';
    }
    box.innerHTML = html;
  }

  function fmt(v, n){ 
    if (!isFinite(v)) return '—';
    var d = n == null ? 2 : n;
    var s = v.toFixed(d);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  /* 滑块：id 唯一，便于程序化 setSlider */
  var SL = {};
  function slider(id, lab, min, max, step, val, cb){
    var row = document.createElement('div'); row.className = 'row';
    var l = document.createElement('label'); l.textContent = lab;
    var inp = document.createElement('input');
    inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = val;
    var out = document.createElement('div'); out.className = 'out'; out.textContent = val;
    inp.addEventListener('input', function(){
      out.textContent = inp.value;
      cb(parseFloat(inp.value));
      if (window.__EP && window.__EP.redraw) window.__EP.redraw();
    });
    row.appendChild(l); row.appendChild(inp); row.appendChild(out);
    document.getElementById('ctl').appendChild(row);
    SL[id] = { inp: inp, out: out };
    return inp;
  }
  function setSlider(id, v){
    var s = SL[id]; if (!s) return;
    s.inp.value = v; s.out.textContent = v;
  }
  /* 分段按钮组 */
  function seg(items, cur, cb){
    var box = document.createElement('div'); box.className = 'seg';
    items.forEach(function(it){
      var b = document.createElement('button');
      b.textContent = it.t; b.setAttribute('data-v', it.v);
      if (it.v === cur) b.className = 'on';
      b.addEventListener('click', function(){
        box.querySelectorAll('button').forEach(function(x){ x.className = ''; });
        b.className = 'on';
        cb(it.v);
        if (window.__EP && window.__EP.redraw) window.__EP.redraw();
      });
      box.appendChild(b);
    });
    document.getElementById('ctl').appendChild(box);
    return box;
  }
  function setSeg(box, v){
    if (!box) return;
    box.querySelectorAll('button').forEach(function(x){
      x.className = (x.getAttribute('data-v') === String(v)) ? 'on' : '';
    });
  }

  /* ---------- 指针拖拽 ---------- */
  function pos(e){
    var r = cv.getBoundingClientRect();
    return { px: e.clientX - r.left, py: e.clientY - r.top };
  }
  cv.addEventListener('pointerdown', function(e){
    var q = pos(e), best = -1, bd = 1e9;
    for (var i = 0; i < HS.length; i++){
      var d = Math.hypot(q.px - X(HS[i].x), q.py - Y(HS[i].y));
      if (d < HS[i].r && d < bd){ bd = d; best = i; }
    }
    if (best < 0) return;
    dragging = best;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
    if (window.__EP && window.__EP.redraw) window.__EP.redraw();
  });
  cv.addEventListener('pointermove', function(e){
    var q = pos(e);
    if (dragging >= 0 && HS[dragging]){
      var w = inv(q.px, q.py);
      HS[dragging].cb(w.x, w.y);
      if (window.__EP && window.__EP.redraw) window.__EP.redraw();
      return;
    }
    // hover 指针样式
    var hit = false;
    for (var i = 0; i < HS.length; i++){
      if (Math.hypot(q.px - X(HS[i].x), q.py - Y(HS[i].y)) < HS[i].r){ hit = true; break; }
    }
    cv.style.cursor = hit ? 'grab' : 'default';
  });
  function up(){ dragging = -1; if (window.__EP && window.__EP.redraw) window.__EP.redraw(); }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', up);

  window.addEventListener('resize', function(){ resize(); });

  return { X:X, Y:Y, inv:inv, fit:fit, clear:clear, line:line, poly:poly, circle:circle,
           arc:arcPath, sector:sector, dot:dot, text:text, label:label, right:right, ticks:ticks,
           handle:handle, ro:ro, fmt:fmt, slider:slider, setSlider:setSlider, seg:seg, setSeg:setSeg,
           resize:resize, P:P, get W(){ return W; }, get H(){ return H; }, get view(){ return view; } };
})();

/* ============ 步骤导航 ============ */
(function(){
  var STEPS = window.STEPS || [];
  var i = 0;
  function render(){
    var s = STEPS[i];
    document.getElementById('stitle').innerHTML = s.t;
    document.getElementById('sdesc').innerHTML = s.d;
    var dots = document.getElementById('dots');
    dots.innerHTML = '';
    for (var k = 0; k < STEPS.length; k++){
      var e = document.createElement('i');
      if (k <= i) e.className = 'on';
      dots.appendChild(e);
    }
    document.getElementById('sfoot').textContent = '第 ' + (i+1) + ' / ' + STEPS.length + ' 步';
    document.getElementById('prev').disabled = (i === 0);
    document.getElementById('next').disabled = (i === STEPS.length - 1);
    document.getElementById('next').textContent = (i === STEPS.length - 1) ? '已是最后一步' : '下一步 →';
    if (window.__EP && window.__EP.onStep) window.__EP.onStep(i, s.p || null);
    // 步骤切完必须重绘：图形要跟着这一步的参数变（第 2 版漏了这句，读数停在上一步）
    if (window.__EP && window.__EP.redraw) window.__EP.redraw();
    if (window.VOICE_CUR !== undefined){ /* 占位：有声版在此处切换音频 */ }
  }
  document.getElementById('prev').addEventListener('click', function(){ if (i > 0){ i--; render(); } });
  document.getElementById('next').addEventListener('click', function(){ if (i < STEPS.length-1){ i++; render(); } });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft' && i > 0){ i--; render(); }
    if (e.key === 'ArrowRight' && i < STEPS.length-1){ i++; render(); }
  });
  window.__goStep = function(n){ i = Math.max(0, Math.min(STEPS.length-1, n)); render(); };
  window.__renderStep = render;
})();
</script>
<script>
window.__EP = (function(){
  var st = { A:[-2.4, 2.3], B:[2.6, 1.5], px:1.8 };

  function controls(){}
  function sync(){}

  function draw(){
    S.clear();
    var A = st.A, B = st.B, Bp = [B[0], -B[1]];
    var P = [st.px, 0];

    S.fit(3.9, 2.4, 40, 0, 0);

    // 那条直线（河岸 / 镜面）
    var vw = (S.W / S.view.s) / 2;
    S.line(-vw, 0, vw, 0, {c:'rgba(125,211,252,.45)', w:1.8});
    S.label(vw * 0.70, 0, '这条直线上找 P', {dy:-16, size:11, c:'#6a7f9c'});

    // 最优位置：AB' 与直线交点
    var t = A[1] / (A[1] - Bp[1]);
    var Pst = [A[0] + (Bp[0] - A[0]) * t, 0];

    // B 的翻折虚线
    S.line(B[0], B[1], Bp[0], Bp[1], {c:'rgba(196,181,253,.55)', w:1.4, dash:[4,4]});
    S.right(B[0], 0, 0, 1, 1, 0, {c:'rgba(196,181,253,.6)', k:0.26});

    // A → P → B 的折线
    S.line(A[0], A[1], P[0], P[1], {c:'#7dd3fc', w:2.6});
    S.line(P[0], P[1], B[0], B[1], {c:'#34d399', w:2.6});
    // A → B' 的直线（理论最短）
    S.line(A[0], A[1], Bp[0], Bp[1], {c:'rgba(251,191,36,.75)', w:1.6, dash:[7,5]});
    // P → B' 辅助
    S.line(P[0], P[1], Bp[0], Bp[1], {c:'rgba(52,211,153,.5)', w:1.4, dash:[4,4]});

    // PB = PB′：两条都打两道刻线，等长一目了然
    S.ticks(P[0], P[1], B[0], B[1], 2, {c:'#34d399'});
    S.ticks(P[0], P[1], Bp[0], Bp[1], 2, {c:'#34d399'});

    // 最优点标记
    S.line(Pst[0], 0, Pst[0], 0.30, {c:'#fbbf24', w:2});
    S.label(Pst[0], 0, 'P*', {dy:-24, size:12, c:'#fbbf24', bold:true});

    S.label(A[0], A[1], 'A', {dx:-16, dy:-14, bold:true});
    S.label(B[0], B[1], 'B', {dx:16, dy:-12, bold:true});
    S.label(Bp[0], Bp[1], "B′", {dx:16, dy:12, bold:true, c:'#c4b5fd'});
    S.label(P[0], P[1], 'P', {dy:20, bold:true, c:'#fbbf24'});

    S.handle(P[0], 0, function(x){ st.px = Math.max(-3.4, Math.min(3.4, x)); });
    S.handle(A[0], A[1], function(x, y){ st.A = [x, Math.max(0.5, Math.min(2.6, y))]; });
    S.handle(B[0], B[1], function(x, y){ st.B = [x, Math.max(0.5, Math.min(2.6, y))]; });

    var PA = Math.hypot(P[0]-A[0], P[1]-A[1]);
    var PB = Math.hypot(P[0]-B[0], P[1]-B[1]);
    var ABp = Math.hypot(Bp[0]-A[0], Bp[1]-A[1]);
    var sum = PA + PB;
    var gap = sum - ABp;
    var atMin = gap < 0.02;

    S.ro([
      {k:'PA', v:S.fmt(PA,2)},
      {k:'PB', v:S.fmt(PB,2)},
      {k:'PA + PB', v:S.fmt(sum,2), cls: atMin ? 'on' : ''},
      {k:'AB′（理论最短）', v:S.fmt(ABp,2)},
      {k:'多走的距离', v:S.fmt(gap,2), cls: atMin ? 'on' : 'warn'}
    ]);
  }

  function onStep(i, p){
    if (!p) { sync(); return; }
    for (var k in p) if (k !== 'opt') st[k] = p[k];
    if (p.opt){
      // 最优点 = A 与 B′ 连线与这条直线的交点（别手填，直接算）
      var Bp = [st.B[0], -st.B[1]];
      var t = st.A[1] / (st.A[1] - Bp[1]);
      st.px = st.A[0] + (Bp[0] - st.A[0]) * t;
    }
    sync();
  }
  return { st:st, controls:controls, redraw:draw, onStep:onStep };
})();
</script>
<script>
(function(){
  S.resize();
  if (window.__EP && window.__EP.controls) window.__EP.controls();
  if (window.__renderStep) window.__renderStep();
  if (window.__EP && window.__EP.redraw) window.__EP.redraw();
})();
</script>
