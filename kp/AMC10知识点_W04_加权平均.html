<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>平均与加权平均 · 人多的一边说了算</title>
<style>
:root{--bg:#0b1220;--card:#121a2b;--card2:#0e1626;--ink:#e8eefc;--ink2:#93a3bd;
 --ink3:#5d6d88;--cool:#4fd1c5;--hi:#ffd166;--warm:#ff5b5b;--line:#22314b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 760px at 50% -12%,#17253f 0%,var(--bg) 62%);
 background-attachment:fixed;color:var(--ink);min-height:100vh;
 font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
 display:flex;justify-content:center;padding:20px 14px 32px;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:560px;display:flex;flex-direction:column;gap:13px}
header{padding:2px 2px 0}
.kicker{display:inline-block;font-size:12.5px;letter-spacing:.08em;color:#9db4d8;
 background:rgba(79,209,197,.10);border:1px solid rgba(79,209,197,.28);
 padding:4px 11px;border-radius:999px;margin-bottom:10px}
h1{font-size:21px;line-height:1.42;font-weight:700}
h1 em{font-style:normal;color:var(--cool)}
h1 .sub{display:block;font-size:14.5px;font-weight:400;color:var(--ink2);margin-top:6px}
.stage{background:linear-gradient(180deg,#101a2c,#0c1424);border:1px solid var(--line);
 border-radius:18px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.35)}
svg{display:block;width:100%;height:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
 padding:14px;display:flex;flex-direction:column;gap:9px}
.slider{display:flex;align-items:center;gap:9px}
.slider span{font-size:12.5px;color:var(--ink2);white-space:nowrap;min-width:78px}
.slider output{font-size:13.5px;color:var(--hi);font-weight:700;min-width:44px;
 text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:3px;
 background:linear-gradient(90deg,rgba(79,209,197,.55),rgba(79,209,197,.12));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
 border-radius:50%;background:var(--cool);border:2px solid #0b1220;cursor:pointer;
 box-shadow:0 0 0 3px rgba(79,209,197,.22)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
 background:var(--cool);border:2px solid #0b1220;cursor:pointer}
.readout{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px}
.cmp{display:flex;gap:10px;margin-bottom:10px}
.cmp div{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;
 padding:10px;text-align:center}
.cmp .k{font-size:11.5px;color:var(--ink3);display:block;margin-bottom:4px}
.cmp .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.cmp .a .n{color:var(--ink2)} .cmp .w .n{color:var(--cool)}
.readout .line{font-size:13.5px;line-height:1.85;color:#cdd8ea}
.readout .line b{color:var(--hi);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink3);line-height:1.68;padding:0 3px}
.note b{color:var(--ink2)}
@media(max-width:400px){h1{font-size:19px}}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="kicker">AMC10 · 应用题 · W04</div>
    <h1>加权平均：<em>人多的一边说了算</em>
      <span class="sub">两个平均数直接相加再除以 2，只在人数一样时才对</span>
    </h1>
  </header>

  <section class="stage">
    <svg id="cv" viewBox="0 0 560 340" aria-label="加权平均示意">
      <!-- 轴 -->
      <line x1="40" y1="230" x2="520" y2="230" stroke="#2b4463" stroke-width="2"/>
      <g id="ticks"></g>

      <!-- 两组柱 -->
      <rect id="bar1" x="100" y="130" width="46" height="100" rx="6" fill="#4fd1c5" fill-opacity=".85"/>
      <rect id="bar2" x="400" y="130" width="46" height="100" rx="6" fill="#ffd166" fill-opacity=".85"/>
      <text id="lab1" x="123" y="118" fill="#a8f0e8" font-size="13" text-anchor="middle" font-weight="700"></text>
      <text id="lab2" x="423" y="118" fill="#fbc96b" font-size="13" text-anchor="middle" font-weight="700"></text>

      <!-- 算术平均：中点虚标 -->
      <line id="midLine" x1="280" y1="70" x2="280" y2="244"
            stroke="#5d6d88" stroke-width="1.6" stroke-dasharray="5 5"/>
      <text id="midT" x="280" y="60" fill="#93a3bd" font-size="12" text-anchor="middle">算术平均</text>

      <!-- 加权平均：支点 -->
      <g id="pivot">
        <line x1="280" y1="96" x2="280" y2="230" stroke="#4fd1c5" stroke-width="2.4"/>
        <path d="M280,236 L268,254 L292,254 Z" fill="#4fd1c5"/>
        <text id="pvT" x="280" y="276" fill="#4fd1c5" font-size="13"
              text-anchor="middle" font-weight="800"></text>
      </g>
    </svg>
  </section>

  <section class="panel">
    <label class="slider">
      <span>第一组 人数</span>
      <input id="n1" type="range" min="1" max="20" step="1" value="3">
      <output id="n1o">3</output>
    </label>
    <label class="slider">
      <span>第一组 平均</span>
      <input id="m1" type="range" min="50" max="85" step="1" value="60">
      <output id="m1o">60</output>
    </label>
    <label class="slider">
      <span>第二组 人数</span>
      <input id="n2" type="range" min="1" max="20" step="1" value="9">
      <output id="n2o">9</output>
    </label>
    <label class="slider">
      <span>第二组 平均</span>
      <input id="m2" type="range" min="65" max="100" step="1" value="90">
      <output id="m2o">90</output>
    </label>
  </section>

  <div class="readout">
    <div class="cmp">
      <div class="a"><span class="k">算术平均（直接平均）</span><span class="n" id="as">75</span></div>
      <div class="w"><span class="k">加权平均（按人数）</span><span class="n" id="ws">82.5</span></div>
    </div>
    <div class="line" id="f1"></div>
    <div class="line" id="f2"></div>
  </div>

  <p class="note" id="note">
    <b>什么时候可以直接平均？</b>只有两组人数一样的时候。人数不同，算术平均就把少的那组当成了和多的那组一样的份量 ——
    这就是加权平均要解决的问题。
  </p>

</div>

<script>
(function(){
  "use strict";
  var S = { n1: 3, m1: 60, n2: 9, m2: 90 };
  var $ = function(id){ return document.getElementById(id); };

  var AX0 = 60, AX1 = 500;      // 轴的像素范围
  var LO = 45, HI = 105;        // 分数显示范围

  function xOf(v){ return AX0 + (v - LO) / (HI - LO) * (AX1 - AX0); }
  function fmt(x){
    var r = Math.round(x * 100) / 100;
    return (Math.abs(r - Math.round(r)) < 1e-9) ? String(Math.round(r)) : r.toFixed(2);
  }

  function draw(){
    var n1 = S.n1, n2 = S.n2, m1 = S.m1, m2 = S.m2;
    var w = (n1 * m1 + n2 * m2) / (n1 + n2);
    var s = (m1 + m2) / 2;

    // 刻度
    var ticks = $('ticks'); ticks.innerHTML = '';
    for (var v = 50; v <= 100; v += 10){
      var x = xOf(v);
      var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', x); l.setAttribute('y1', 230);
      l.setAttribute('x2', x); l.setAttribute('y2', 240);
      l.setAttribute('stroke', '#3a5577'); l.setAttribute('stroke-width', 1.4);
      ticks.appendChild(l);
      var t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', x); t.setAttribute('y', 256);
      t.setAttribute('fill', '#5d6d88'); t.setAttribute('font-size', '11');
      t.setAttribute('text-anchor', 'middle'); t.textContent = String(v);
      ticks.appendChild(t);
    }

    // 两组柱：位置 = 平均分，高度 ∝ 人数
    var h1 = 18 + n1 * 4.6, h2 = 18 + n2 * 4.6;
    var x1 = xOf(m1), x2 = xOf(m2);
    var b1 = $('bar1'), b2 = $('bar2');
    b1.setAttribute('x', (x1 - 23).toFixed(1));
    b1.setAttribute('y', (230 - h1).toFixed(1));
    b1.setAttribute('height', h1.toFixed(1));
    b2.setAttribute('x', (x2 - 23).toFixed(1));
    b2.setAttribute('y', (230 - h2).toFixed(1));
    b2.setAttribute('height', h2.toFixed(1));

    $('lab1').setAttribute('x', x1.toFixed(1));
    $('lab1').setAttribute('y', (230 - h1 - 10).toFixed(1));
    $('lab1').textContent = n1 + ' 人 · ' + m1;
    $('lab2').setAttribute('x', x2.toFixed(1));
    $('lab2').setAttribute('y', (230 - h2 - 10).toFixed(1));
    $('lab2').textContent = n2 + ' 人 · ' + m2;

    // 算术平均中点
    var xs = xOf(s), xw = xOf(w);
    $('midLine').setAttribute('x1', xs.toFixed(1));
    $('midLine').setAttribute('x2', xs.toFixed(1));
    $('midT').setAttribute('x', xs.toFixed(1));

    // 支点 = 加权平均
    var pv = $('pivot');
    var line = pv.querySelector('line'), tri = pv.querySelector('path');
    line.setAttribute('x1', xw.toFixed(1)); line.setAttribute('x2', xw.toFixed(1));
    tri.setAttribute('d', 'M' + xw.toFixed(1) + ',236 L' + (xw - 12).toFixed(1) + ',254 L'
      + (xw + 12).toFixed(1) + ',254 Z');
    $('pvT').setAttribute('x', xw.toFixed(1));
    $('pvT').textContent = '加权 ' + fmt(w);

    $('as').textContent = fmt(s);
    $('ws').textContent = fmt(w);

    $('f1').innerHTML = '(' + m1 + ' + ' + m2 + ') ÷ 2 = <b>' + fmt(s) + '</b>　←　把两组的份量当成一样';
    $('f2').innerHTML = '(' + n1 + '×' + m1 + ' + ' + n2 + '×' + m2 + ') ÷ (' + n1 + ' + ' + n2
      + ') = <b>' + fmt(w) + '</b>　←　按人数加权';

    // 哪边被拉过去
    var near = (Math.abs(w - m1) < Math.abs(w - m2)) ? '第一组' : '第二组';
    var same = (n1 === n2);
    $('note').innerHTML = same
      ? '<b>现在两组人数一样，所以两个平均正好相等。</b>把人数调得不一样，它们就会分开。'
      : '<b>加权平均偏向' + near + '。</b>人多的那组份量大，把结果往自己这边拉 —— 这就是「加权」两个字的实际含义。';
  }

  function bind(id, key, outId){
    var el = $(id);
    el.addEventListener('input', function(){
      S[key] = parseInt(el.value, 10);
      $(outId).textContent = el.value;
      draw();
    });
  }
  bind('n1', 'n1', 'n1o'); bind('m1', 'm1', 'm1o');
  bind('n2', 'n2', 'n2o'); bind('m2', 'm2', 'm2o');

  draw();
})();
</script>
</body>
</html>
