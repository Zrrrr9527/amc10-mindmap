<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMC10知识点_R01_柱锥球体积与表面积</title>
<style>
:root{
  --bg1:#0a182e; --ink:#eaf2ff; --ink2:#9fb3cf; --ink3:#6a7f9c;
  --sky:#7dd3fc; --amber:#f59e0b; --green:#22c55e; --blue:#3b82f6;
  --line:#22405f; --card:rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(1100px 760px at 50% -8%, #16375c 0%, var(--bg1) 62%);
  background-attachment:fixed; color:var(--ink); min-height:100vh;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; padding:18px 14px 40px;
  display:flex; justify-content:center;
}
.app{width:100%;max-width:780px;display:flex;flex-direction:column;gap:14px}

/* 顶部 */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{background:#3a5484;color:#d6e6fc;font-size:12.5px;font-weight:700;
  padding:6px 13px;border-radius:999px;white-space:nowrap}
.hint{margin-left:auto;font-size:12px;color:var(--ink3)}
h1{font-size:22px;font-weight:800;letter-spacing:.03em;line-height:1.35}
h1 em{font-style:normal;color:var(--sky)}

/* 舞台 */
.stage{
  position:relative;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg, rgba(125,211,252,.06), rgba(10,24,46,.2));
  border:1.5px solid var(--line);
}
canvas{display:block;width:100%;height:auto;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.rota{
  position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--ink3);
  background:rgba(10,24,46,.7);padding:4px 9px;border-radius:7px;pointer-events:none;
}

/* 控制 */
.ctrl{display:flex;flex-direction:column;gap:11px;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row .lab{font-size:13px;color:var(--ink2);min-width:64px}
input[type=range]{
  flex:1;min-width:140px;-webkit-appearance:none;height:6px;border-radius:3px;
  background:#2b4a6e;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--sky);cursor:pointer;box-shadow:0 2px 8px rgba(125,211,252,.4);
}
.row output{font-size:14px;font-weight:700;color:var(--sky);
  font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.seg{display:flex;gap:6px;background:#16263f;padding:4px;border-radius:10px}
.seg button{
  font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 15px;border-radius:7px;
  border:none;background:transparent;color:var(--ink2);cursor:pointer;transition:.15s;
}
.seg button.on{background:var(--sky);color:#08243c}

/* 数值卡 */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:13px;
  padding:12px 13px;position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;
  border-radius:2px;background:var(--c)}
.card .nm{font-size:12px;color:var(--ink2);font-weight:700}
.card .vl{font-size:19px;font-weight:800;margin-top:5px;color:var(--c);
  font-variant-numeric:tabular-nums}
.card .fm{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.5}

/* 条形对比 */
.bars{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.bars h2{font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:11px;letter-spacing:.03em}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar:last-child{margin-bottom:0}
.bar .bn{font-size:12.5px;color:var(--ink2);min-width:30px}
.bar .bt{flex:1;height:22px;background:#16263f;border-radius:6px;overflow:hidden;position:relative}
.bar .bf{height:100%;border-radius:6px;transition:width .3s cubic-bezier(.2,.7,.3,1)}
.bar .bv{font-size:12.5px;font-weight:700;min-width:56px;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--ink)}

/* 结论 */
.conc{
  background:rgba(245,158,11,.11);border:1.5px solid rgba(245,158,11,.3);
  border-radius:14px;padding:13px 16px;font-size:13.5px;line-height:1.7;color:#fbd38d;
}
.conc b{color:#fbbf24}
.conc .eq{font-size:17px;font-weight:800;color:#fbbf24;letter-spacing:.04em;
  font-variant-numeric:tabular-nums}

@media(max-width:560px){
  h1{font-size:19px}
  .cards{grid-template-columns:1fr}
  .card .vl{font-size:17px}
  .row .lab{min-width:52px;font-size:12.5px}
}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <span class="chip">AMC10 · 立体几何 · R01</span>
    <span class="hint">拖动画面可旋转</span>
  </div>
  <h1>柱、锥、球：<em>三个公式，一个除法</em></h1>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="rota">按住拖动 → 旋转视角</div>
  </div>

  <div class="ctrl">
    <div class="row">
      <span class="lab">半径 r</span>
      <input id="rng" type="range" min="0.70" max="1.30" step="0.01" value="1.00">
      <output id="rout">1.00</output>
    </div>
    <div class="row">
      <span class="lab">显示</span>
      <div class="seg">
        <button class="on" data-m="v">体积</button>
        <button data-m="s">表面积</button>
      </div>
      <span class="hint" style="margin-left:auto;font-size:11.5px">柱与锥的高都取 2r</span>
    </div>
  </div>

  <div class="cards">
    <div class="card" style="--c:#3b82f6">
      <div class="nm">圆柱</div>
      <div class="vl" id="cyl">2.00π</div>
      <div class="fm" id="cyl-f">V = πr² · 2r</div>
    </div>
    <div class="card" style="--c:#f59e0b">
      <div class="nm">圆锥</div>
      <div class="vl" id="cone">0.67π</div>
      <div class="fm" id="cone-f">V = πr² · 2r ÷ 3</div>
    </div>
    <div class="card" style="--c:#22c55e">
      <div class="nm">球</div>
      <div class="vl" id="ball">1.33π</div>
      <div class="fm" id="ball-f">V = 4πr³ ÷ 3</div>
    </div>
  </div>

  <div class="bars">
    <h2 id="barTitle">体积对比（同半径、同高）</h2>
    <div class="bar">
      <span class="bn">柱</span>
      <div class="bt"><div class="bf" id="b1" style="background:#3b82f6"></div></div>
      <span class="bv" id="v1">3.00</span>
    </div>
    <div class="bar">
      <span class="bn">锥</span>
      <div class="bt"><div class="bf" id="b2" style="background:#f59e0b"></div></div>
      <span class="bv" id="v2">1.00</span>
    </div>
    <div class="bar">
      <span class="bn">球</span>
      <div class="bt"><div class="bf" id="b3" style="background:#22c55e"></div></div>
      <span class="bv" id="v3">2.00</span>
    </div>
  </div>

  <div class="conc" id="conc">
    <b>关键不在三个公式，在三个比例。</b>同样的半径 r、同样的高 2r ——<br>
    <span class="eq">柱 : 锥 : 球 = 3 : 1 : 2</span><br>
    这就是为什么圆锥的体积永远要除以 3：它只占同底同高的柱的三分之一。
  </div>

</div>

<script>
(function(){
  'use strict';

  // ---------------- 状态 ----------------
  var S = { r: 1.0, mode: 'v', yaw: -0.45, pitch: 0.20 };

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var CW = 0, CH = 0, DPR = 1;

  // 世界坐标：y 向上，形状底面都落在 y = 0
  // 三个形状的中心 x：-2.3r, 0, +2.3r
  var GAP = 2.70;

  // ---------------- 3D 核心 ----------------
  var CAM_D = 5.2;      // 相机距离（世界单位），用于透视

  function rotPt(p){
    var cy = Math.cos(S.yaw), sy = Math.sin(S.yaw);
    var x1 = p[0] * cy + p[2] * sy;
    var z1 = -p[0] * sy + p[2] * cy;
    var cp = Math.cos(S.pitch), sp = Math.sin(S.pitch);
    var y1 = p[1] * cp + z1 * sp;
    var z2 = -p[1] * sp + z1 * cp;
    return [x1, y1, z2];
  }

  // 世界 → 屏幕；返回 [sx, sy, depth]
  // 用正交投影（不做近大远小）：三个形状半径相同，画出来就必须一样大，
  // 否则「同半径比较」这件事在视觉上就不成立。立体感交给明暗和俯视角。
  function toScreen(p){
    var q = rotPt(p);
    return [
      CW / 2 + q[0] * SCALE,
      CH * 0.52 - (q[1] - 1.0) * SCALE,
      q[2]
    ];
  }

  var SCALE = 100;  // 每世界单位对应像素（随画布宽和 r 重算）

  function normalOf(pts){
    var a = pts[0], b = pts[1], c = pts[2];
    var ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2];
    var vx = c[0]-a[0], vy = c[1]-a[1], vz = c[2]-a[2];
    var nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    var L = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
    return [nx/L, ny/L, nz/L];
  }

  // 光源方向（世界坐标，指向光）
  var LIGHT = (function(){
    var v = [-0.45, 0.80, 0.55];
    var L = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
    return [v[0]/L, v[1]/L, v[2]/L];
  })();

  function shadeOf(pts, rgb){
    var n = normalOf(pts);
    var d = Math.abs(n[0]*LIGHT[0] + n[1]*LIGHT[1] + n[2]*LIGHT[2]);
    var k = 0.42 + 0.62 * d;              // 环境光 + 漫反射
    if (k > 1.12) k = 1.12;
    return 'rgba(' + Math.min(255, rgb[0]*k | 0) + ',' +
                     Math.min(255, rgb[1]*k | 0) + ',' +
                     Math.min(255, rgb[2]*k | 0) + ',0.94)';
  }

  // 面集合：{pts:[[x,y,z]...], rgb:[r,g,b], edge:'rgba(...)'}
  var faces = [];

  function pushFace(pts, rgb, edge){
    faces.push({ pts: pts, rgb: rgb, edge: edge || null });
  }

  // ---- 圆柱：底 y=0，顶 y=h，中心 (cx,0)
  function addCylinder(cx, r, h, rgb){
    var N = 44;
    for (var i = 0; i < N; i++){
      var t1 = 2*Math.PI*i/N, t2 = 2*Math.PI*(i+1)/N;
      var x1 = cx + r*Math.cos(t1), z1 = r*Math.sin(t1);
      var x2 = cx + r*Math.cos(t2), z2 = r*Math.sin(t2);
      pushFace([[x1,0,z1],[x2,0,z2],[x2,h,z2],[x1,h,z1]], rgb);
    }
    // 顶面、底面（单个多边形）
    var top = [], bot = [];
    for (var j = 0; j < N; j++){
      var t = 2*Math.PI*j/N;
      top.push([cx + r*Math.cos(t), h, r*Math.sin(t)]);
      bot.push([cx + r*Math.cos(t), 0, r*Math.sin(t)]);
    }
    pushFace(top, rgb, 'rgba(125,211,252,.35)');
    pushFace(bot, rgb, 'rgba(125,211,252,.35)');
  }

  // ---- 圆锥：底 y=0，顶点 y=h
  function addCone(cx, r, h, rgb){
    var N = 44, apex = [cx, h, 0];
    for (var i = 0; i < N; i++){
      var t1 = 2*Math.PI*i/N, t2 = 2*Math.PI*(i+1)/N;
      var x1 = cx + r*Math.cos(t1), z1 = r*Math.sin(t1);
      var x2 = cx + r*Math.cos(t2), z2 = r*Math.sin(t2);
      pushFace([[x1,0,z1],[x2,0,z2],apex], rgb);
    }
    var bot = [];
    for (var j = 0; j < N; j++){
      var t = 2*Math.PI*j/N;
      bot.push([cx + r*Math.cos(t), 0, r*Math.sin(t)]);
    }
    pushFace(bot, rgb, 'rgba(245,158,11,.35)');
  }

  // ---- 球：球心 (cx, r, 0)，半径 r
  function addSphere(cx, r, rgb){
    var SEG = 30, RING = 16;
    function P(phi, th){
      return [cx + r*Math.sin(phi)*Math.cos(th),
              r + r*Math.cos(phi),
              r*Math.sin(phi)*Math.sin(th)];
    }
    var NORTH = [cx, 2*r, 0], SOUTH = [cx, 0, 0];
    for (var i = 0; i < RING; i++){
      var p1 = Math.PI*i/RING, p2 = Math.PI*(i+1)/RING;
      for (var j = 0; j < SEG; j++){
        var t1 = 2*Math.PI*j/SEG, t2 = 2*Math.PI*(j+1)/SEG;
        if (i === 0){
          pushFace([NORTH, P(p2,t1), P(p2,t2)], rgb);          // 北极：三角形
        } else if (i === RING-1){
          pushFace([P(p1,t1), SOUTH, P(p1,t2)], rgb);          // 南极：三角形
        } else {
          pushFace([P(p1,t1), P(p2,t1), P(p2,t2), P(p1,t2)], rgb);
        }
      }
    }
  }

  // ---------------- 重建几何 ----------------
  function build(){
    faces.length = 0;
    var r = S.r, h = 2 * r;
    addCylinder(-GAP*r, r, h, [59,130,246]);   // 蓝
    addCone(0, r, h, [245,158,11]);            // 琥珀
    addSphere(GAP*r, r, [34,197,94]);          // 绿
  }

  // ---------------- 画布尺寸 ----------------
  function resize(){
    var box = cv.parentNode.getBoundingClientRect();
    CW = Math.max(280, Math.round(box.width));
    CH = Math.round(CW * 0.62);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = CW * DPR;
    cv.height = CH * DPR;
    cv.style.height = CH + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 让最大尺寸（r=1.3）刚好放下。正交投影下横向宽度会被 cos(yaw) 压缩。
    var wWorld = (2*GAP + 2) * 1.30;
    SCALE = Math.min(150, (CW - 56) / (wWorld * Math.cos(S.yaw)));
  }

  // ---------------- 绘制 ----------------
  function draw(){
    ctx.clearRect(0, 0, CW, CH);

    var list = [];
    for (var i = 0; i < faces.length; i++){
      var f = faces[i], pts2 = [], zmax = -1e9;
      for (var j = 0; j < f.pts.length; j++){
        var p = toScreen(f.pts[j]);
        pts2.push(p); if (p[2] > zmax) zmax = p[2];
      }
      list.push({
        p2: pts2,
        z: zmax,
        fill: shadeOf(f.pts, f.rgb),
        edge: f.edge
      });
    }
    // 画家算法：远的先画（z 大 = 远）
    list.sort(function(a, b){ return b.z - a.z; });

    for (var k = 0; k < list.length; k++){
      var it = list[k];
      ctx.beginPath();
      ctx.moveTo(it.p2[0][0], it.p2[0][1]);
      for (var m = 1; m < it.p2.length; m++) ctx.lineTo(it.p2[m][0], it.p2[m][1]);
      ctx.closePath();
      ctx.fillStyle = it.fill;
      ctx.fill();
      if (it.edge){
        ctx.strokeStyle = it.edge;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }

    drawLabels();
  }

  function drawLabels(){
    var r = S.r;
    var anchors = [
      { x: -GAP*r, txt: '圆柱', c: '#7dd3fc' },
      { x: 0,      txt: '圆锥', c: '#fbbf24' },
      { x: GAP*r,  txt: '球',   c: '#4ade80' }
    ];
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
    for (var i = 0; i < anchors.length; i++){
      var q = rotPt([anchors[i].x, 0, 0]);
      var x = CW/2 + q[0] * SCALE;
      ctx.fillStyle = anchors[i].c;
      ctx.fillText(anchors[i].txt, x, CH - 30);
    }
    // 高度标尺
    ctx.strokeStyle = 'rgba(159,179,207,.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 5]);
    var hL = toScreen([-GAP*r - r*1.5, 0, 0]);
    var hR = toScreen([-GAP*r - r*1.5, 2*r, 0]);
    ctx.beginPath(); ctx.moveTo(hL[0], hL[1]); ctx.lineTo(hR[0], hR[1]); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(159,179,207,.75)';
    ctx.font = '600 11px "PingFang SC",sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('h = 2r', hL[0] - 6, (hL[1] + hR[1]) / 2);
  }

  function render(){
    draw();
    updateNumbers();
  }

  // ---------------- 数值 ----------------
  var PI_FMT = function(coef){
    return coef.toFixed(2) + 'π';
  };

  function updateNumbers(){
    var r = S.r, r3 = r*r*r, r2 = r*r;
    var isV = (S.mode === 'v');

    // 体积（以 π 为单位）
    var cV = 2 * r3;                 // 柱 2πr³
    var oV = (2/3) * r3;             // 锥 (2/3)πr³
    var sV = (4/3) * r3;             // 球 (4/3)πr³

    // 表面积（以 π 为单位）
    var cS = 6 * r2;                              // 柱 2πr²+2πr·2r = 6πr²
    var oS = (1 + Math.sqrt(5)) * r2;             // 锥 πr²+πrl, l=r√5
    var sS = 4 * r2;                              // 球 4πr²

    var a = isV ? cV : cS, b = isV ? oV : oS, c = isV ? sV : sS;

    document.getElementById('cyl').textContent = PI_FMT(a);
    document.getElementById('cone').textContent = PI_FMT(b);
    document.getElementById('ball').textContent = PI_FMT(c);

    document.getElementById('cyl-f').textContent = isV ? 'V = πr² · 2r' : 'S = 2πr² + 2πr·2r';
    document.getElementById('cone-f').textContent = isV ? 'V = πr² · 2r ÷ 3' : 'S = πr² + πr·母线';
    document.getElementById('ball-f').textContent = isV ? 'V = 4πr³ ÷ 3' : 'S = 4πr²';

    // 条形
    var mx = Math.max(a, b, c) || 1;
    document.getElementById('b1').style.width = (a/mx*100) + '%';
    document.getElementById('b2').style.width = (b/mx*100) + '%';
    document.getElementById('b3').style.width = (c/mx*100) + '%';
    document.getElementById('v1').textContent = a.toFixed(2) + 'π';
    document.getElementById('v2').textContent = b.toFixed(2) + 'π';
    document.getElementById('v3').textContent = c.toFixed(2) + 'π';

    document.getElementById('barTitle').textContent =
      isV ? '体积对比（同半径、同高 2r）' : '表面积对比（同半径）';

    // 结论区：体积恒为 3:1:2；表面积不是
    var conc = document.getElementById('conc');
    if (isV){
      conc.innerHTML =
        '<b>关键不在三个公式，在三个比例。</b>同样的半径 r、同样的高 2r ——<br>' +
        '<span class="eq">柱 : 锥 : 球 = 3 : 1 : 2</span><br>' +
        '这就是为什么圆锥的体积永远要除以 3：它只占同底同高的柱的三分之一。';
    } else {
      var ratio = (a/b).toFixed(2);
      conc.innerHTML =
        '<b>换成表面积，这个漂亮比例就没有了。</b>柱 ' + a.toFixed(2) + 'π 是锥 ' +
        b.toFixed(2) + 'π 的 <b>' + ratio + ' 倍</b>，不是 3 倍。<br>' +
        '因为锥的侧面积要用<b>母线</b>（r√5），不是用高。<br>' +
        '<span style="color:#9fb3cf">柱 : 锥 : 球 = 6 : 3.24 : 4（取 r = 1）</span>';
    }
  }

  // ---------------- 交互：拖动旋转 ----------------
  var dragging = false, lastX = 0, lastY = 0, raf = 0;

  function schedule(){
    if (raf) return;
    raf = requestAnimationFrame(function(){ raf = 0; draw(); });
  }

  function down(e){
    dragging = true;
    cv.classList.add('drag');
    var p = e.touches ? e.touches[0] : e;
    lastX = p.clientX; lastY = p.clientY;
  }
  function move(e){
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    var dx = p.clientX - lastX, dy = p.clientY - lastY;
    lastX = p.clientX; lastY = p.clientY;
    S.yaw += dx * 0.008;
    S.pitch = Math.max(-0.9, Math.min(0.9, S.pitch + dy * 0.006));
    if (e.cancelable) e.preventDefault();
    schedule();
  }
  function up(){
    dragging = false;
    cv.classList.remove('drag');
  }

  cv.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  cv.addEventListener('touchstart', down, { passive: true });
  cv.addEventListener('touchmove', move, { passive: false });
  cv.addEventListener('touchend', up);

  // 滑块
  var rng = document.getElementById('rng'), rout = document.getElementById('rout');
  rng.addEventListener('input', function(){
    S.r = parseFloat(rng.value);
    rout.textContent = S.r.toFixed(2);
    build();
    render();
  });

  // 模式
  var segBtns = document.querySelectorAll('.seg button');
  for (var i = 0; i < segBtns.length; i++){
    segBtns[i].addEventListener('click', function(){
      for (var j = 0; j < segBtns.length; j++) segBtns[j].classList.remove('on');
      this.classList.add('on');
      S.mode = this.getAttribute('data-m');
      updateNumbers();
    });
  }

  // ---------------- 启动 ----------------
  var rt = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ resize(); render(); }, 120);
  });

  resize();
  build();
  render();
})();
</script>
</body>
</html>
