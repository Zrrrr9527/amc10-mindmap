<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>等差数列求和 · 两个公式为什么是一回事</title>
<style>
:root{
  --bg:#0b1220; --card:#121a2b; --card2:#0e1626;
  --ink:#e8eefc; --ink2:#93a3bd; --ink3:#5d6d88;
  --cool:#4fd1c5; --hi:#ffd166; --warm:#ff5b5b;
  --line:#22314b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(1200px 760px at 50% -12%, #17253f 0%, var(--bg) 62%);
  background-attachment:fixed; color:var(--ink); min-height:100vh;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  display:flex; justify-content:center; padding:20px 14px 32px;
  -webkit-font-smoothing:antialiased;
}
.app{width:100%;max-width:580px;display:flex;flex-direction:column;gap:13px}

header{padding:2px 2px 0}
.kicker{display:inline-block;font-size:12.5px;letter-spacing:.08em;color:#9db4d8;
  background:rgba(79,209,197,.10);border:1px solid rgba(79,209,197,.28);
  padding:4px 11px;border-radius:999px;margin-bottom:10px}
h1{font-size:21px;line-height:1.42;font-weight:700}
h1 em{font-style:normal;color:var(--cool)}
h1 .sub{display:block;font-size:14.5px;font-weight:400;color:var(--ink2);margin-top:6px}

.stage{background:linear-gradient(180deg,#101a2c,#0c1424);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.35)}
svg{display:block;width:100%;height:auto}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;display:flex;flex-direction:column;gap:11px}
.slider{display:flex;align-items:center;gap:10px}
.slider span{font-size:13px;color:var(--ink2);white-space:nowrap;min-width:52px}
.slider output{font-size:14.5px;color:var(--hi);font-weight:700;min-width:44px;
  text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:3px;
  background:linear-gradient(90deg,rgba(79,209,197,.55),rgba(79,209,197,.12));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;
  border-radius:50%;background:var(--cool);border:2px solid #0b1220;cursor:pointer;
  box-shadow:0 0 0 3px rgba(79,209,197,.22)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;
  background:var(--cool);border:2px solid #0b1220;cursor:pointer}

.toggle{display:flex;gap:8px}
.toggle button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--ink3);
  border-radius:10px;padding:10px;font-size:13.5px;font-weight:700;font-family:inherit;
  cursor:pointer;transition:.16s}
.toggle button.on{background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.5);color:#fbc96b}

.formulas{display:flex;flex-direction:column;gap:9px}
.f{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.f .ttl{font-size:12px;color:var(--ink3);margin-bottom:6px;letter-spacing:.03em}
.f .eq{font-size:14.5px;color:#cdd8ea;line-height:1.75;
  font-family:"Cambria Math","Cambria","Times New Roman",serif}
.f .val{margin-top:7px;font-size:22px;font-weight:800;color:var(--cool);
  font-variant-numeric:tabular-nums;line-height:1.2}
.f .val small{font-size:12.5px;font-weight:400;color:var(--ink3);margin-left:8px;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif}

.same{background:rgba(95,208,138,.09);border:1px solid rgba(95,208,138,.34);
  border-radius:12px;padding:11px 14px;font-size:13.5px;color:#8fe0b0;line-height:1.6}
.same b{color:#b6f0cc}

.note{font-size:13px;color:var(--ink3);line-height:1.68;padding:0 3px}
.note b{color:var(--ink2)}
@media(max-width:400px){
  h1{font-size:19px} .f .val{font-size:19px}
}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="kicker">AMC10 · 数列 · B07</div>
    <h1>两个求和公式，<em>其实是同一件事</em>
      <span class="sub">首尾配对 —— 拖参数看每对的和为什么都不变</span>
    </h1>
  </header>

  <section class="stage">
    <svg id="chart" viewBox="0 0 560 250" aria-label="等差数列柱状图"></svg>
  </section>

  <section class="panel">
    <label class="slider">
      <span>首项 a₁</span>
      <input id="a1" type="range" min="1" max="6" step="1" value="1">
      <output id="a1o">1</output>
    </label>
    <label class="slider">
      <span>公差 d</span>
      <input id="d" type="range" min="-2" max="3" step="1" value="2">
      <output id="do">2</output>
    </label>
    <label class="slider">
      <span>项数 n</span>
      <input id="n" type="range" min="1" max="12" step="1" value="8">
      <output id="no">8</output>
    </label>
    <div class="toggle">
      <button id="pairBtn" class="on">显示首尾配对</button>
    </div>
  </section>

  <div class="formulas">
    <div class="f">
      <div class="ttl">式一 · 用首尾两项</div>
      <div class="eq" id="eq1"></div>
      <div class="val" id="v1"></div>
    </div>
    <div class="f">
      <div class="ttl">式二 · 用首项和公差</div>
      <div class="eq" id="eq2"></div>
      <div class="val" id="v2"></div>
    </div>
  </div>

  <div class="same" id="same"></div>

  <p class="note">
    <b>什么时候用哪个：</b>题目给了 a₁ 和 d，用式二，不用先求末项；
    给了 a₁ 和 aₙ，用式一，一行就出。
  </p>

</div>

<script>
(function(){
  "use strict";

  var PCOL = ['#4fd1c5','#ffd166','#f472b6','#a78bfa','#5fd08a','#fb923c'];
  var S = { a1: 1, d: 2, n: 8, pair: true };

  var svg = document.getElementById('chart');
  var NS = 'http://www.w3.org/2000/svg';

  function mk(tag, attrs, txt){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (txt !== undefined) e.textContent = txt;
    return e;
  }

  function terms(){
    var arr = [];
    for (var i = 0; i < S.n; i++) arr.push(S.a1 + i * S.d);
    return arr;
  }

  // 第 i 项属于第几对（-1 = 中间落单）
  function pairIndex(i, n){
    if (i < Math.floor(n/2)) return i;
    if (n % 2 === 1 && i === Math.floor(n/2)) return -1;
    return n - 1 - i;
  }

  function draw(){
    var arr = terms(), n = arr.length;
    svg.innerHTML = '';

    var W = 560, H = 250, PADT = 34, PADB = 30, PADL = 16, PADR = 16;
    var plotW = W - PADL - PADR, plotH = H - PADT - PADB;

    var lo = Math.min.apply(null, arr.concat([0]));
    var hi = Math.max.apply(null, arr.concat([0]));
    if (hi === lo) hi = lo + 1;

    function yOf(v){ return PADT + (hi - v) / (hi - lo) * plotH; }
    var y0 = yOf(0);

    // 零线
    svg.appendChild(mk('line', {x1: PADL, y1: y0, x2: W - PADR, y2: y0,
      stroke: '#2b4463', 'stroke-width': 1.4}));

    var slot = plotW / n;
    var bw = Math.max(6, Math.min(38, slot * 0.58));

    for (var i = 0; i < n; i++){
      var v = arr[i];
      var cx = PADL + slot * (i + 0.5);
      var y = yOf(v);
      var pi = pairIndex(i, n);
      var col = (pi < 0) ? '#5d6d88' : (S.pair ? PCOL[pi % PCOL.length] : '#4a6b8f');
      var yTop = Math.min(y, y0), hgt = Math.max(2, Math.abs(y0 - y));

      svg.appendChild(mk('rect', {
        x: cx - bw/2, y: yTop, width: bw, height: hgt, rx: 4,
        fill: col, 'fill-opacity': S.pair ? .88 : .5
      }));

      // 数值标签（项数少时才标，避免挤）
      if (n <= 9){
        svg.appendChild(mk('text', {
          x: cx, y: (v >= 0 ? y - 7 : y + 16), fill: '#93a3bd',
          'font-size': '12', 'text-anchor': 'middle'
        }, String(v)));
      }
      // 下标
      svg.appendChild(mk('text', {
        x: cx, y: H - PADB + 18, fill: '#3f5570',
        'font-size': '11', 'text-anchor': 'middle'
      }, String(i + 1)));
    }

    // 配对弧线
    if (S.pair && n > 1){
      var pairs = Math.floor(n / 2);
      var topY = PADT - 16;
      for (var p = 0; p < pairs; p++){
        var xa = PADL + slot * (p + 0.5);
        var xb = PADL + slot * (n - 1 - p + 0.5);
        var col2 = PCOL[p % PCOL.length];
        svg.appendChild(mk('path', {
          d: 'M ' + xa + ' ' + (topY + 6) + ' Q ' + ((xa+xb)/2) + ' ' + (topY - 12)
             + ' ' + xb + ' ' + (topY + 6),
          fill: 'none', stroke: col2, 'stroke-opacity': .55, 'stroke-width': 1.6
        }));
      }
    }

    updateMath(arr);
  }

  function updateMath(arr){
    var n = arr.length, a1 = arr[0], an = arr[n-1];
    var S1 = n * (a1 + an) / 2;
    var S2 = n * a1 + n * (n - 1) * S.d / 2;

    document.getElementById('eq1').innerHTML =
      'S<sub>n</sub> = n(a₁ + a<sub>n</sub>) / 2 = ' + n + ' × (' + a1 + ' + ' + an + ') / 2';
    document.getElementById('v1').innerHTML = fmt(S1) + '<small>首尾配对</small>';

    document.getElementById('eq2').innerHTML =
      'S<sub>n</sub> = n·a₁ + n(n−1)d / 2 = ' + n + '×' + a1 + ' + ' + n + '×' + (n-1) + '×' + S.d + ' / 2';
    document.getElementById('v2').innerHTML = fmt(S2) + '<small>首项 + 公差</small>';

    var pairs = Math.floor(n / 2);
    var mid = (n % 2 === 1) ? arr[pairs] : null;
    var msg;
    if (n === 1){
      msg = '只有一项：S = a₁ = <b>' + a1 + '</b>。';
    } else if (mid === null){
      msg = '首尾配成 <b>' + pairs + '</b> 对，每对的和都是 a₁ + aₙ = <b>' +
            (a1 + an) + '</b>，所以 S = ' + pairs + ' × ' + (a1 + an) + ' = <b>' + fmt(S1) + '</b>。';
    } else {
      msg = '配成 <b>' + pairs + '</b> 对，每对和都是 <b>' + (a1 + an) +
            '</b>；中间第 ' + (pairs + 1) + ' 项落单，值正好是 <b>' + mid +
            '</b>（一对和的一半）。';
    }
    if (Math.abs(S1 - S2) < 1e-9){
      msg += ' 两个公式算出同一个数 —— <b>它们是一回事</b>。';
    }
    document.getElementById('same').innerHTML = msg;
  }

  function fmt(x){
    return (Math.abs(x - Math.round(x)) < 1e-9) ? String(Math.round(x)) : x.toFixed(2);
  }

  function bind(id, key, outId){
    var el = document.getElementById(id);
    el.addEventListener('input', function(){
      S[key] = parseInt(el.value, 10);
      document.getElementById(outId).textContent = el.value;
      draw();
    });
  }
  bind('a1', 'a1', 'a1o');
  bind('d',  'd',  'do');
  bind('n',  'n',  'no');

  document.getElementById('pairBtn').addEventListener('click', function(){
    S.pair = !S.pair;
    this.className = S.pair ? 'on' : '';
    draw();
  });

  draw();
})();
</script>
</body>
</html>
